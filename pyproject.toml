[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sforge-edgebenchverified"
version = "0.1.0.dev0"
description = "Independent EdgeBench verification fork; unreleased"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
keywords = ["evaluation", "benchmark", "code-agent", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "docker>=7.0",
    "tqdm",
    "rich",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "jinja2",
    "requests",
    "pyyaml>=6.0",
    "typing_extensions>=4.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
e2b = ["e2b>=2.46.0,<3"]

[project.scripts]
sforge = "sforge.cli:main"

[project.urls]
Upstream = "https://github.com/ByteDance-Seed/EdgeBench"

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.sdist]
only-include = ["sforge"]

[tool.hatch.build.targets.wheel]
packages = ["sforge"]
