<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>SMT Solver witness checker</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<rect x="16" y="12" width="328" height="270" rx="8" fill="none" class="rule" stroke-width="1.5"/>
<text x="180" y="38" class="muted" font-size="15" text-anchor="middle" font-weight="400">Original checker</text>
<rect x="28" y="54" width="148" height="52" rx="5" class="accBg"/><rect x="28" y="54" width="148" height="52" rx="5" fill="none" class="accS" stroke-width="1.5"/>
<text x="102" y="75" class="ink" font-size="14" text-anchor="middle" font-weight="400">let x = a</text>
<text x="102" y="95" class="ink" font-size="14" text-anchor="middle" font-weight="600">(f x) = a</text>
<rect x="184" y="54" width="148" height="52" rx="5" class="accBg"/><rect x="184" y="54" width="148" height="52" rx="5" fill="none" class="accS" stroke-width="1.5"/>
<text x="258" y="75" class="ink" font-size="14" text-anchor="middle" font-weight="400">let x = b</text>
<text x="258" y="95" class="ink" font-size="14" text-anchor="middle" font-weight="600">(f x) = b</text>
<path d="M102 108 L166 166 M258 108 L194 166" fill="none" class="inkS" stroke-width="2"/>
<rect x="135" y="168" width="90" height="34" rx="5" class="badBg"/><rect x="135" y="168" width="90" height="34" rx="5" fill="none" class="badS" stroke-width="2"/>
<text x="180" y="191" class="bad" font-size="16" text-anchor="middle" font-weight="600">(f x)</text>
<text x="180" y="224" class="muted" font-size="14" text-anchor="middle" font-weight="400">one text key, two values</text>
<text x="180" y="258" class="bad" font-size="17" text-anchor="middle" font-weight="700">no answer passes ✗</text>
<rect x="376" y="12" width="328" height="270" rx="8" fill="none" class="rule" stroke-width="1.5"/>
<text x="540" y="38" class="muted" font-size="15" text-anchor="middle" font-weight="400">Fixed checker</text>
<rect x="388" y="54" width="148" height="52" rx="5" class="accBg"/><rect x="388" y="54" width="148" height="52" rx="5" fill="none" class="accS" stroke-width="1.5"/>
<text x="462" y="75" class="ink" font-size="14" text-anchor="middle" font-weight="400">let x = a</text>
<text x="462" y="95" class="ink" font-size="14" text-anchor="middle" font-weight="600">(f x) = a</text>
<rect x="544" y="54" width="148" height="52" rx="5" class="accBg"/><rect x="544" y="54" width="148" height="52" rx="5" fill="none" class="accS" stroke-width="1.5"/>
<text x="618" y="75" class="ink" font-size="14" text-anchor="middle" font-weight="400">let x = b</text>
<text x="618" y="95" class="ink" font-size="14" text-anchor="middle" font-weight="600">(f x) = b</text>
<path d="M462 108 L462 164" fill="none" class="inkS" stroke-width="2"/>
<rect x="422" y="168" width="80" height="34" rx="5" class="goodBg"/><rect x="422" y="168" width="80" height="34" rx="5" fill="none" class="goodS" stroke-width="2"/>
<text x="462" y="191" class="good" font-size="16" text-anchor="middle" font-weight="600">(f a)</text>
<path d="M618 108 L618 164" fill="none" class="inkS" stroke-width="2"/>
<rect x="578" y="168" width="80" height="34" rx="5" class="goodBg"/><rect x="578" y="168" width="80" height="34" rx="5" fill="none" class="goodS" stroke-width="2"/>
<text x="618" y="191" class="good" font-size="16" text-anchor="middle" font-weight="600">(f b)</text>
<text x="540" y="224" class="muted" font-size="14" text-anchor="middle" font-weight="400">one key per actual argument</text>
<text x="540" y="258" class="good" font-size="17" text-anchor="middle" font-weight="700">correct answer accepted ✓</text>
<text x="16" y="306" class="ink" font-size="14" text-anchor="start" font-weight="400">27 hidden problems unwinnable originally; a perfect solver's</text>
<text x="16" y="326" class="ink" font-size="14" text-anchor="start" font-weight="400">maximum is 72.40 instead of 78.61.</text>

