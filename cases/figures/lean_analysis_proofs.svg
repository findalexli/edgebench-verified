<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Lean Analysis graded targets</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="16" y="30" font-size="18" font-weight="700" class="ink">Some graded targets cannot be earned fairly</text>
<text x="16" y="60" font-size="14" class="muted">The original grades 2901 targets (1 point each); the fixed version keeps 2338</text>
<rect x="16" y="72" width="554" height="36" class="good"/>
<rect x="572" y="72" width="130" height="36" class="bad"/>
<rect x="703" y="72" width="1" height="36" class="warn"/>
<text x="293" y="96" font-size="15" text-anchor="middle" class="bg" style="font-weight:700">2338 kept</text>
<text x="637" y="96" font-size="15" text-anchor="middle" class="bg" style="font-weight:700">560</text>
<text x="702" y="132" font-size="14" text-anchor="end" class="bad">hidden helpers made by the compiler: not scored in the fix</text>
<text x="704" y="152" font-size="14" text-anchor="end" class="warn">3 placeholder statements: not scored in the fix</text>
<rect x="16" y="176" width="336" height="108" rx="8" class="badBg"/>
<text x="32" y="204" font-size="15" font-weight="700" class="bad">2 false statements</text>
<text x="32" y="230" font-size="14" class="ink">No correct proof can earn them.</text>
<text x="32" y="254" font-size="14" class="ink">The fix corrects both statements.</text>
<rect x="368" y="176" width="336" height="108" rx="8" class="warnBg"/>
<text x="384" y="204" font-size="15" font-weight="700" class="warn">Same proof, other tactic</text>
<text x="384" y="230" font-size="14" class="ink">With the omega tactic, a hidden helper</text>
<text x="384" y="254" font-size="14" class="ink">gets a new name: 1 point less (25 vs 26).</text>
</svg>
