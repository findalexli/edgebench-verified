<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img">
<title>任何提交的得分都不可能超过 21.02 分（满分 100）</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78} .onbar{fill:#ffffff}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .ruleS{stroke:#d3dbe0}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4} .ruleF{fill:#eef2f4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3} .onbar{fill:#10181f}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .ruleS{stroke:#2a3843}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c} .ruleF{fill:#1d2a34}
  }
</style>
<text x="16" y="24" class="ink" font-size="16" font-weight="600">任何提交的得分都不可能超过 21.02 分（满分 100）</text>
<text x="16" y="46" class="muted" font-size="14">评分器在 2N² 回合后结束每局游戏，因此 50 个用例的总回合数最多为 92,304。</text>
<text x="40" y="80" class="muted" font-size="15">原始分数刻度</text>
<rect x="40" y="120" width="134.5" height="28" class="goodBg"/><rect x="174.5" y="120" width="505.5" height="28" class="badBg"/>
<text x="427" y="139" class="bad" font-size="15" font-weight="600" text-anchor="middle">无法达到</text>
<line x1="174.5" y1="98" x2="174.5" y2="148" class="inkS" stroke-width="2"/>
<text x="182.5" y="110" class="ink" font-size="14" font-weight="600">上限：92,304 回合 = 21.02</text>
<circle cx="59.5" cy="134" r="5" class="acc"/>
<text x="69.5" y="139" class="acc" font-size="14" font-weight="600">3.04</text>
<line x1="40.0" y1="148" x2="40.0" y2="156" class="inkS" stroke-width="1.5"/>
<text x="40.0" y="174" class="ink" font-size="15" font-weight="600" text-anchor="start">0</text>
<text x="40.0" y="192" class="muted" font-size="14" text-anchor="start">5,369</text>
<line x1="168.0" y1="148" x2="168.0" y2="156" class="inkS" stroke-width="1.5"/>
<text x="168.0" y="174" class="ink" font-size="15" font-weight="600" text-anchor="middle">20</text>
<text x="168.0" y="192" class="muted" font-size="14" text-anchor="middle">88,189</text>
<line x1="552.0" y1="148" x2="552.0" y2="156" class="inkS" stroke-width="1.5"/>
<text x="552.0" y="174" class="ink" font-size="15" font-weight="600" text-anchor="middle">80</text>
<text x="552.0" y="192" class="muted" font-size="14" text-anchor="middle">330,195</text>
<line x1="680.0" y1="148" x2="680.0" y2="156" class="inkS" stroke-width="1.5"/>
<text x="680.0" y="174" class="ink" font-size="15" font-weight="600" text-anchor="end">100</text>
<text x="680.0" y="192" class="muted" font-size="14" text-anchor="end">451,198</text>
<text x="40" y="216" class="muted" font-size="13">粗体：得分（满分 100）。灰色：得到该分数所需的总回合数。</text>
<text x="40" y="256" class="muted" font-size="15">修复版分数刻度</text>
<rect x="40" y="268" width="640" height="28" class="goodBg"/>
<circle cx="144.7" cy="282" r="5" class="acc"/>
<text x="154.7" y="287" class="acc" font-size="14" font-weight="600">16.36</text>
<text x="40" y="318" class="ink" font-size="15" font-weight="600">0 = 3,418 回合（初始代码）</text>
<text x="680" y="318" class="ink" font-size="15" font-weight="600" text-anchor="end">100 = 92,304 回合（上限）</text>
<circle cx="46" cy="347" r="5" class="acc"/>
<text x="58" y="352" class="acc" font-size="14" font-weight="600">诚实的测试解法：17,960 回合，两种刻度下原始结果相同</text>
<text x="40" y="378" class="muted" font-size="13">提交之间的先后顺序不变。是否有提交能达到上限尚未证明。</text>
</svg>
