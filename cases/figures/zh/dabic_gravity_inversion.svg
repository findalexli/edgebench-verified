<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" role="img">
<title>100 分中有 42 分来自提交自己的声明，因此该任务被移除</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">100 分中有 42 分来自提交自己的声明，因此该任务被移除</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start">任务：用 D-ABIC 方法，从重力数据推断地下密度。分数为 0–100 分。</text>
<text x="16" y="88" class="ink" font-size="14" text-anchor="start" font-weight="600">这 100 分从哪里来</text>
<rect x="16.0" y="100" width="240.8" height="44" class="goodBg"/><rect x="16.0" y="100" width="240.8" height="44" fill="none" class="goodS" stroke-width="2"/>
<text x="136.4" y="129" class="good" font-size="16" text-anchor="middle" font-weight="700">35 分</text>
<text x="24" y="168" class="good" font-size="13" text-anchor="start" font-weight="600">由评分器重新计算：</text>
<text x="24" y="187" class="ink" font-size="13" text-anchor="start">在隐藏测试用例上</text>
<text x="24" y="206" class="ink" font-size="13" text-anchor="start">运行提交的代码</text>
<rect x="256.8" y="100" width="289.0" height="44" class="badBg"/><rect x="256.8" y="100" width="289.0" height="44" fill="none" class="badS" stroke-width="2"/>
<text x="401.28" y="129" class="bad" font-size="18" text-anchor="middle" font-weight="700">12 + 30 = 42 分</text>
<line x1="339.4" y1="100" x2="339.4" y2="144" class="badS" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="264.8" y="168" class="bad" font-size="13" text-anchor="start" font-weight="600">从提交自己的结果文件中读取，</text>
<text x="264.8" y="187" class="ink" font-size="13" text-anchor="start">按原样计分；</text>
<text x="264.8" y="206" class="ink" font-size="13" text-anchor="start">评分器从不核实</text>
<rect x="545.8" y="100" width="158.2" height="44" class="warnBg"/><rect x="545.8" y="100" width="158.2" height="44" fill="none" class="warnS" stroke-width="2"/>
<text x="624.88" y="129" class="warn" font-size="16" text-anchor="middle" font-weight="700">23 分</text>
<text x="553.76" y="168" class="warn" font-size="13" text-anchor="start" font-weight="600">其他检查</text>
<text x="553.76" y="187" class="ink" font-size="13" text-anchor="start">代码文本：3 分</text>
<text x="553.76" y="206" class="ink" font-size="13" text-anchor="start">行为监控：8 分</text>
<text x="553.76" y="225" class="ink" font-size="13" text-anchor="start">报告关键词：12 分</text>
<rect x="16" y="240" width="688" height="80" rx="8" class="badBg"/>
<text x="32" y="264" class="bad" font-size="15" text-anchor="start" font-weight="700">为什么移除该任务，而不是修复</text>
<text x="32" y="286" class="ink" font-size="13.5" text-anchor="start">可靠的修复需要评分器根据隐藏数据自行重新计算这 42 分，而不是从提交中读取。</text>
<text x="32" y="306" class="ink" font-size="13.5" text-anchor="start">做不到这一点，这 42 分奖励的就是声明，而不是实际工作。</text>
<text x="16" y="346" class="muted" font-size="13" text-anchor="start">另一个问题已修复，但不足以保留该任务：两种允许且等价的方法形式之一被暗中扣分</text>
<text x="16" y="364" class="muted" font-size="13" text-anchor="start">（同样高水平的工作：88.92 分对 42.86 分，满分 100，按评分器自己的规则计算）。</text>
</svg>
