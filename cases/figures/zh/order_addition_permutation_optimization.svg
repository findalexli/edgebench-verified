<text x="616" y="206.39324374090666" class="ink" font-size="13" text-anchor="middle" font-weight="600">15.91</text>
<rect x="659" y="149.4" width="34" height="102.6" class="good"/>
<text x="676" y="143.36624714442667" class="ink" font-size="13" text-anchor="middle" font-weight="600">41.24</text>
