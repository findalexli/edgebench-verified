<text x="436" y="286" class="muted" font-size="13" text-anchor="middle" font-weight="400">自动</text>
<text x="496" y="270" class="ink" font-size="13" text-anchor="middle" font-weight="600">6</text>
<text x="496" y="286" class="muted" font-size="13" text-anchor="middle" font-weight="400">智能体</text>
