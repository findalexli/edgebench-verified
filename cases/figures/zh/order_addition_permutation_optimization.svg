<text x="16" y="456" class="ink" font-size="13.5" text-anchor="start" font-weight="400">选取规则：保留通过测试最多的提交；只有 5 项全部通过时才比较分数。</text>
<text x="16" y="476" class="muted" font-size="13.5" text-anchor="start" font-weight="400">原始：所有有分数的提交并列为 5 项中通过 4 项，一直保留第一个。修复版：5 项全过，最好的胜出。</text>
<text x="16" y="496" class="muted" font-size="13" text-anchor="start" font-weight="400">自动 = 平台自动评分的一份工作副本；智能体 = 智能体自己提交的。</text>
<text x="16" y="516" class="muted" font-size="13" text-anchor="start" font-weight="400">条形颜色：金色 = 原始评分器保留的提交；绿色 = 修复版评分器保留的提交；蓝色 = 其他已评分的工作。</text>
</svg>
