<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img">
<title>一项过时的文件检查让每个提交都有一项测试不通过，因此一次真实智能体运行保留 3.79 分（满分 100），而不是 41.24 分</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4} .cell{fill:#f1f4f6}
  text{font-family:"IBM Plex Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c} .cell{fill:#1c2a34}
  }
</style>
<text x="16" y="26" class="ink" font-size="17" text-anchor="start" font-weight="600">一项过时的文件检查让每个提交都有一项测试不通过，</text>
<text x="16" y="48" class="ink" font-size="17" text-anchor="start" font-weight="600">于是一次真实智能体运行只保留 3.79 分（满分 100），而不是 41.24 分</text>
<text x="16" y="74" class="muted" font-size="14" text-anchor="start" font-weight="400">任务：把 1 到 1000 排成一个顺序，使一个隐藏的代价尽可能小。</text>
<text x="16" y="94" class="muted" font-size="14" text-anchor="start" font-weight="400">5 项测试中有一项要求辅助文件是旧版本，因此所有提交都过不了这一项。</text>
<text x="16" y="124" class="ink" font-size="14" text-anchor="start" font-weight="600">每个提交的 0–100 分，按评分顺序排列（两个评分器给出的分数相同）</text>
