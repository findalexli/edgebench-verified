<text x="158" y="157.44444444444446" class="muted" font-size="13" text-anchor="end" font-weight="400">40</text>
<rect x="479" y="242.6" width="34" height="9.4" class="warn"/>
<text x="496" y="236.5775282151822" class="ink" font-size="13" text-anchor="middle" font-weight="600">3.79</text>
<rect x="539" y="212.4" width="34" height="39.6" class="acc"/>
<text x="556" y="206.39324374090666" class="ink" font-size="13" text-anchor="middle" font-weight="600">15.91</text>
