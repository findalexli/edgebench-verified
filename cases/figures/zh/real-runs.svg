<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">重新评分一次真实智能体运行：7 个任务中有 2 个的运行成绩发生变化</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start" font-weight="400">每个任务一次四小时的 Claude Opus 5.5 运行，分别用原始评分器和修复版评分器重新评分。</text>
