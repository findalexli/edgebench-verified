<circle cx="453.184" cy="309" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="443.184" y="313.5" class="ink" font-size="13" text-anchor="end" font-weight="400">99.66 = 99.66</text>
<rect x="598.0" y="303" width="75.8" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="313.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+25.26</text>
<text x="214" y="334" class="muted" font-size="13" text-anchor="start" font-weight="400">105 份提交中有 14 份分数变化；最佳提交不变。</text>
<text x="16" y="363.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Molecular Self Assembly</text>
<line x1="448.5" y1="359" x2="454.0" y2="359" class="mutedS" stroke-width="2"/>
<circle cx="448.5" cy="359" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="359" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="438.511" y="363.5" class="ink" font-size="13" text-anchor="end" font-weight="400">95.91–100 → 100</text>
<rect x="598.0" y="353" width="36.7" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="363.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+12.22</text>
<text x="214" y="384" class="muted" font-size="13" text-anchor="start" font-weight="400">全部 8 份受评提交的分数都上升；保留的提交原本已接近刻度顶端；该运行在它自</text>
<text x="214" y="401" class="muted" font-size="13" text-anchor="start" font-weight="400">己的机器上记录的是 100（13 份中评了 8 份）。</text>
<text x="16" y="430.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Tree Block Partitioning</text>
<line x1="454.0" y1="426" x2="454.0" y2="426" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="426" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="426" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="430.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="430.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">问题从未发生</text>
<text x="214" y="451" class="muted" font-size="13" text-anchor="start" font-weight="400">差异来自接近时限时的计时波动，两个评分器都有（25 份中评了 13 份）。</text>
<text x="16" y="480.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Graph Node Classification</text>
<line x1="431.2" y1="476" x2="431.1" y2="476" class="mutedS" stroke-width="2"/>
<circle cx="431.2" cy="476" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="431.115" cy="476" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="421.115" y="480.5" class="ink" font-size="13" text-anchor="end" font-weight="400">90.44–90.60 → 90.43–90.60</text>
<text x="598" y="480.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">问题从未发生</text>
<text x="214" y="501" class="muted" font-size="13" text-anchor="start" font-weight="400">两个评分器下的差异都是计时波动；该运行在它自己的机器上记录的是 90.85（118</text>
<text x="214" y="518" class="muted" font-size="13" text-anchor="start" font-weight="400">份中评了 112 份）。</text>
<text x="16" y="540.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Schemathesis Config</text>
<text x="16" y="555.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Modernization</text>
<line x1="454.0" y1="543" x2="454.0" y2="543" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="543" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="543" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="547.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="547.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">问题从未发生</text>
<text x="214" y="568" class="muted" font-size="13" text-anchor="start" font-weight="400">全部 30 份提交在两个评分器下得分相同。</text>
<text x="16" y="597.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Borden Source Inversion</text>
<circle cx="346.3" cy="593" r="5" class="bg mutedS" stroke-width="2"/>
<text x="336.337" y="597.5" class="ink" font-size="13" text-anchor="end" font-weight="400">55.14（原始结果 60.10）</text>
<text x="598" y="597.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">评分器不变；需要新的运行</text>
<text x="214" y="618" class="muted" font-size="13" text-anchor="start" font-weight="400">评分器不变，因此旧答案得分相同（原始结果 60.10，即 55.14 分，满分</text>
<text x="214" y="635" class="muted" font-size="13" text-anchor="start" font-weight="400">100）；该修复改变的是任务说明，只有新的运行才能显示它的作用。</text>
<text x="16" y="660" class="muted" font-size="13" text-anchor="start" font-weight="400">两个评分器都在我们的机器上重新评分；区间为三次评分的范围。</text>
<text x="16" y="678" class="muted" font-size="13" text-anchor="start" font-weight="400">它表明这些问题确实发生在真实智能体身上，有时也并未发生；它不能衡量对 12 小时排行榜的影响。</text>

