<text x="598" y="146.5" class="ink" font-size="13" text-anchor="middle" font-weight="400">0（分数相同）</text>
<text x="214" y="167" class="muted" font-size="13" text-anchor="start" font-weight="400">每份提交自身的分数不变；修复版评分器保留了后来一份更好的提交（9 份提交）。</text>
<text x="16" y="196.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Integer Compression Codec</text>
<line x1="386.6" y1="192" x2="343.5" y2="192" class="mutedS" stroke-width="2"/>
<circle cx="386.6" cy="192" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="343.479" cy="192" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="333.479" y="196.5" class="ink" font-size="13" text-anchor="end" font-weight="400">71.93–73.03 → 53.95</text>
<rect x="509.0" y="186" width="89.0" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="604" y="196.5" class="ink" font-size="13" text-anchor="start" font-weight="400">−29.68</text>
<text x="214" y="217" class="muted" font-size="13" text-anchor="start" font-weight="400">原始结果提高 1.7–4 倍；修复后的 0–100 分刻度使运行成绩降低；该运行在它自</text>
<text x="214" y="234" class="muted" font-size="13" text-anchor="start" font-weight="400">己的机器上记录的是 75.72（37 份提交）。</text>
<text x="16" y="263.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Lean Analysis Proofs</text>
<line x1="446.5" y1="259" x2="450.2" y2="259" class="mutedS" stroke-width="2"/>
