<rect x="598.0" y="253" width="14.8" height="12" rx="2" class="bg accS" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="592" y="263.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+4.95</text>
<text x="214" y="284" class="muted" font-size="13" text-anchor="start" font-weight="400">由原始评分器保存的逐项判定计算得出，未实际运行（20 份提交）。</text>
<text x="16" y="306.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Juliet Vulnerability</text>
<text x="16" y="321.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Analyzer</text>
<line x1="453.2" y1="309" x2="453.2" y2="309" class="mutedS" stroke-width="2"/>
