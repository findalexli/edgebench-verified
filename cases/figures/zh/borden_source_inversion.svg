<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 578" role="img">
<title>教科书拟合得 7 分；按评分器未说明的物理约定拟合得 31 分</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">教科书拟合得 7 分；按评分器未说明的物理约定拟合得 31 分</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start">任务：根据监测井读数，找出一个隐藏的地下污染源。</text>
<rect x="16" y="68" width="300" height="136" rx="8" class="accBg"/>
<text x="30" y="92" class="acc" font-size="14" text-anchor="start" font-weight="700">任务说明怎么写</text>
<text x="30" y="116" class="ink" font-size="14" text-anchor="start">建立教科书中的地下水模型</text>
<text x="30" y="136" class="ink" font-size="14" text-anchor="start">（对流–弥散方程）。</text>
<text x="30" y="156" class="ink" font-size="14" text-anchor="start">C0 是浓度，单位 mg/L。</text>
<text x="30" y="176" class="ink" font-size="14" text-anchor="start">评分器使用一个“隐藏”模型。</text>
<rect x="328" y="68" width="376" height="136" rx="8" class="badBg"/>
<text x="342" y="92" class="bad" font-size="14" text-anchor="start" font-weight="700">评分器的模型实际怎么做（从未说明）</text>
<text x="342" y="114" class="ink" font-size="14" text-anchor="start">• 把质量速率当作质量</text>
<text x="342" y="133" class="ink" font-size="14" text-anchor="start">• 忽略土壤孔隙度</text>
<text x="342" y="152" class="ink" font-size="14" text-anchor="start">• 释放持续多久，总质量都一样</text>
<text x="342" y="171" class="ink" font-size="14" text-anchor="start">• 把 mg/m³ 当作 mg/L 报告</text>
<text x="342" y="190" class="ink" font-size="14" text-anchor="start">• 把污染源放在源区盒体的一个面上</text>
<text x="16" y="228" class="muted" font-size="13" text-anchor="start">两种模型对公开数据的拟合一样好，所以解题者无法判断评分器用的是哪一种。</text>
<text x="16" y="262" class="ink" font-size="14" text-anchor="start" font-weight="600">对公开数据的一次性拟合</text>
<text x="16" y="280" class="muted" font-size="13" text-anchor="start">基线，以及同一拟合方法的两种物理模型</text>
<text x="340" y="262" class="ink" font-size="14" text-anchor="start" font-weight="600">一次真实的智能体运行：4 小时内 36 个提交</text>
<text x="340" y="280" class="muted" font-size="13" text-anchor="start">每次提交后，评分器都会报告其在隐藏监测井上的误差</text>
