<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img">
<title>无法编译的隐藏测试让 100 分中的 22 分归零</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .ruleF{fill:#eef2f4}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .ruleF{fill:#1d2a34}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="24" class="ink" font-size="15" font-weight="600">无法编译的隐藏测试让 100 分中的 22 分归零</text>
<text x="16" y="44" class="muted" font-size="14">智能体要重建一个包含 14 个包的 Rust 项目，并被要求不得修改测试。</text>
<text x="16" y="78" class="ink" font-size="14" font-weight="600">评分器向全部 14 个包加入隐藏测试</text>
<text x="16" y="96" class="bad" font-size="14">其中两个包，测试被放在无法编译的位置</text>
<rect x="16" y="110" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="129" class="ink" font-size="13">types</text>
<rect x="196" y="110" width="172" height="28" rx="4" class="ruleF"/>
<text x="206" y="129" class="ink" font-size="13">code</text>
<rect x="16" y="144" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="163" class="ink" font-size="13">factory-protocol</text>
<rect x="196" y="144" width="172" height="28" rx="4" class="ruleF"/>
<text x="206" y="163" class="ink" font-size="13">diffs</text>
<rect x="16" y="178" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="197" class="ink" font-size="13">pty</text>
<rect x="196" y="178" width="172" height="28" rx="4" class="ruleF"/>
<text x="206" y="197" class="ink" font-size="13">recording</text>
<rect x="16" y="212" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="231" class="ink" font-size="13">store</text>
<rect x="196" y="212" width="172" height="28" rx="4" class="badBg"/>
<rect x="196" y="212" width="172" height="28" rx="4" fill="none" class="badS" stroke-width="1.5"/>
<text x="206" y="231" class="bad" font-size="13" font-weight="600">search：12 分 → 0</text>
<rect x="16" y="246" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="265" class="ink" font-size="13">core</text>
<rect x="196" y="246" width="172" height="28" rx="4" class="ruleF"/>
<text x="206" y="265" class="ink" font-size="13">mux</text>
<rect x="16" y="280" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="299" class="ink" font-size="13">factory</text>
<rect x="196" y="280" width="172" height="28" rx="4" class="ruleF"/>
<text x="206" y="299" class="ink" font-size="13">mcp</text>
<rect x="16" y="314" width="172" height="28" rx="4" class="ruleF"/>
<text x="26" y="333" class="ink" font-size="13">tui-test</text>
<rect x="196" y="314" width="172" height="28" rx="4" class="badBg"/>
<rect x="196" y="314" width="172" height="28" rx="4" fill="none" class="badS" stroke-width="1.5"/>
<text x="206" y="333" class="bad" font-size="13" font-weight="600">cli：10 分 → 0</text>
<text x="16" y="370" class="ink" font-size="13">cli 是命令行程序。测试和配置保持原样时，</text>
<text x="16" y="388" class="ink" font-size="13">这两个包都得 0 分。</text>
<text x="420" y="78" class="ink" font-size="14" font-weight="600">同一个完整、正确的解法</text>
<text x="420" y="96" class="muted" font-size="14">满分 100，同一份代码评分两次</text>
<line x1="448" y1="330.0" x2="704" y2="330.0" class="rule" stroke-width="1"/>
<text x="440" y="335.0" class="muted" font-size="13" text-anchor="end">0</text>
<line x1="448" y1="228.0" x2="704" y2="228.0" class="rule" stroke-width="1"/>
<text x="440" y="233.0" class="muted" font-size="13" text-anchor="end">50</text>
<line x1="448" y1="126.0" x2="704" y2="126.0" class="rule" stroke-width="1"/>
<text x="440" y="131.0" class="muted" font-size="13" text-anchor="end">100</text>
<rect x="460" y="179.1" width="80" height="150.9" class="bad"/>
<text x="500.0" y="201.1" class="bg" font-size="15" font-weight="600" text-anchor="middle">73.99</text>
<text x="500.0" y="348" class="ink" font-size="13" text-anchor="middle">原始评分器</text>
<rect x="556" y="136.8" width="80" height="193.2" class="good"/>
<text x="596.0" y="158.8" class="bg" font-size="15" font-weight="600" text-anchor="middle">94.70</text>
<text x="596.0" y="348" class="ink" font-size="13" text-anchor="middle">修复版评分器</text>
<line x1="540" y1="179.1" x2="648" y2="179.1" class="inkS" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M642,136.8 H648 V179.1 H642" fill="none" class="inkS" stroke-width="1.5"/>
<text x="654" y="162.9" class="good" font-size="14" font-weight="600">+20.71</text>
<text x="420" y="370" class="ink" font-size="13">增加：search +11.29，cli +9.32，</text>
<text x="420" y="388" class="ink" font-size="13">一项被评分器跳过的测试 +0.10</text>
<text x="16" y="418" class="muted" font-size="13">原始评分器按发布方的运行环境评分。若用按原样发布的文件，会缺少四个库文件，</text>
<text x="16" y="435" class="muted" font-size="13">同一解法得 27.61 分。</text>
</svg>
