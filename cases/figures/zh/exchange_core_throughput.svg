<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img">
<title>通过/不通过对照：原始评分器让一个正确的交易引擎和两个带有现实错误的引擎（向卖方收错手续费、从不发送成交消息）都通过，并按速度给三者计分；修复版评分器先运行项目自带的测试，仍让正确引擎通过，并以 0 分拒绝两个有错误的引擎。</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .markS{stroke:#ffffff}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .markS{stroke:#152029}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="30" font-size="18" font-weight="700" class="ink">两个有错误的交易引擎通过了原始评分器，并按速度得分</text>
<text x="16" y="54" font-size="14" class="muted">任务：在不改变功能的前提下，让一个证券交易撮合引擎运行得更快。</text>
<text x="410.0" y="92" font-size="15" font-weight="700" text-anchor="middle" class="ink">原始评分器</text>
<text x="410.0" y="110" font-size="13" text-anchor="middle" class="muted">只核对资金总额和订单簿</text>
<text x="610.0" y="92" font-size="15" font-weight="700" text-anchor="middle" class="ink">修复版评分器</text>
<text x="610.0" y="110" font-size="13" text-anchor="middle" class="muted">另外运行项目自带的 33 个测试</text>
<line x1="16" y1="124" x2="704" y2="124" class="rule" stroke-width="1"/>
<text x="16" y="151" font-size="15" font-weight="700" class="ink">正确的引擎</text>
<text x="16" y="171" font-size="13" class="muted">项目原有的引擎，未作改动</text>
<rect x="316" y="134" width="188" height="44" rx="6" class="goodBg"/>
<g transform="translate(340,156)"><circle r="11" class="good"/><path d="M-5.5 0.5 L-1.5 4.5 L5.5 -4" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360" y="161" font-size="14" class="good">通过，按速度计分</text>
<rect x="516" y="134" width="188" height="44" rx="6" class="goodBg"/>
<g transform="translate(540,156)"><circle r="11" class="good"/><path d="M-5.5 0.5 L-1.5 4.5 L5.5 -4" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="560" y="161" font-size="14" class="good">通过，按速度计分</text>
<line x1="16" y1="188" x2="704" y2="188" class="rule" stroke-width="1"/>
<text x="16" y="215" font-size="15" font-weight="700" class="ink">向卖方收错手续费</text>
<text x="16" y="235" font-size="13" class="muted">按错误的费率收费；总额仍平衡</text>
<rect x="316" y="198" width="188" height="44" rx="6" class="goodBg"/>
<g transform="translate(340,220)"><circle r="11" class="good"/><path d="M-5.5 0.5 L-1.5 4.5 L5.5 -4" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360" y="225" font-size="14" class="good">通过，按速度计分</text>
<rect x="516" y="198" width="188" height="44" rx="6" class="badBg"/>
<g transform="translate(540,220)"><circle r="11" class="bad"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="560" y="225" font-size="14" class="bad">被拒绝，记 0 分</text>
<line x1="16" y1="252" x2="704" y2="252" class="rule" stroke-width="1"/>
<text x="16" y="279" font-size="15" font-weight="700" class="ink">从不发送成交消息</text>
<text x="16" y="299" font-size="13" class="muted">用户收不到订单的处理结果</text>
<rect x="316" y="262" width="188" height="44" rx="6" class="goodBg"/>
<g transform="translate(340,284)"><circle r="11" class="good"/><path d="M-5.5 0.5 L-1.5 4.5 L5.5 -4" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360" y="289" font-size="14" class="good">通过，按速度计分</text>
<rect x="516" y="262" width="188" height="44" rx="6" class="badBg"/>
<g transform="translate(540,284)"><circle r="11" class="bad"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" fill="none" class="markS" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="560" y="289" font-size="14" class="bad">被拒绝，记 0 分</text>
<line x1="16" y1="316" x2="704" y2="316" class="rule" stroke-width="1"/>
<text x="16" y="342" font-size="13" class="muted">速度分（满分 100）：引擎在计时测试中每秒处理的交易笔数；</text>
<text x="16" y="361" font-size="13" class="muted">每秒 209 万笔或更慢记 0 分，每秒 600 万笔记 100 分。</text>
<text x="16" y="387" font-size="13" class="muted">在原始评分器下，三者的速度分在多次运行间相互重叠（正确引擎 0–24.19，收错手续费 7.77–24.40，</text>
<text x="16" y="406" font-size="13" class="muted">丢失消息 4.71–15.62）：这些错误并没有带来速度优势，只是没有被发现。</text>
<text x="16" y="432" font-size="13" class="muted">在 4 个 CPU 下（EdgeBench 排行榜的设置），连正确的引擎速度分也是 0；修复版评分器仍让它通过。</text>
<text x="16" y="451" font-size="13" class="muted"></text>
</svg>
