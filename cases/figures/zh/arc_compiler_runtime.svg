<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" role="img">
<title>同一份代码得 69.26 分还是 35.59 分，取决于一种任务说明从未提到的返回格式</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78} .onbar{fill:#ffffff}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .ruleS{stroke:#d3dbe0}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4} .ruleF{fill:#eef2f4}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3} .onbar{fill:#10181f}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .ruleS{stroke:#2a3843}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c} .ruleF{fill:#1d2a34}
  }
</style>
<text x="16" y="26" class="ink" font-size="16" font-weight="600">同一份代码得 69.26 分还是 35.59 分，取决于一种任务说明从未提到的返回格式</text>
<text x="16" y="48" class="muted" font-size="14">价值 33.67 分（满分 100）的隐藏测试调用编译器的错误检查器，并只接受一种格式。</text>
<text x="16" y="84" class="ink" font-size="15">返回列表 [{level, message}]（隐藏测试要求的格式）</text>
<rect x="16" y="94" width="526.4" height="34" class="good"/>
<text x="552.4" y="118" font-size="17" font-weight="700" class="ink">69.26<tspan class="muted" font-size="14" font-weight="400">（满分 100）</tspan></text>
<text x="16" y="164" class="ink" font-size="15">沿用初始代码的 {ok, errors, warnings, program}</text>
<rect x="16" y="174" width="270.5" height="34" class="bad"/>
<text x="296.5" y="198" font-size="17" font-weight="700" class="ink">35.59<tspan class="muted" font-size="14" font-weight="400">（满分 100）</tspan></text>
<rect x="16" y="246" width="688" height="58" rx="8" class="warnBg"/>
<text x="32" y="270" class="ink" font-size="14">两者的错误检查逻辑完全相同。类型检查测试通过数：128/128 对 0。</text>
<text x="32" y="292" class="ink" font-size="14">智能体能看到的文件都没有说明这一格式。修复在文档中写明了它；评分器未改动。</text>
</svg>
