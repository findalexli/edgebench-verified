<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img">
<title>失败的调用看起来很快：未完成的代码最多拿到 18.93 分（满分 100）</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78} .onbar{fill:#ffffff}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .ruleS{stroke:#d3dbe0}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4} .ruleF{fill:#eef2f4} .accBox{fill:#eef6f9}
  text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3} .onbar{fill:#10181f}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .ruleS{stroke:#2a3843}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c} .ruleF{fill:#1d2a34} .accBox{fill:#14262f}
  }
</style>
<text x="16" y="26" class="ink" font-size="16" font-weight="600">失败的调用看起来很快：未完成的代码最多拿到 18.93 分（满分 100）</text>
<text x="16" y="48" class="muted" font-size="14">智能体要重写一个图像缩放库；速度测试为每次调用计时，却从不检查其输出。</text>
<text x="16" y="82" class="ink" font-size="14" font-weight="600">1. 问题：原始评分器下的得分（满分 100；一次运行，2 个 CPU）</text>
<text x="704" y="82" class="muted" font-size="13" text-anchor="end">正确性测试</text>
<text x="16" y="111" class="ink" font-size="15">初始代码，</text>
<text x="16" y="129" class="ink" font-size="15">未改动</text>
<rect class="badBg" x="210" y="96" width="400" height="30"/>
<text x="218.00" y="117" class="ink" font-size="15" font-weight="600">0</text>
<text x="704" y="117" class="ink" font-size="15" text-anchor="end">30/30</text>
<text x="16" y="163" class="ink" font-size="15">在 RGBA→RGB24 上</text>
<text x="16" y="181" class="ink" font-size="15">返回错误</text>
<rect class="badBg" x="210" y="148" width="400" height="30"/>
<rect class="bad" x="210" y="148" width="21.56" height="30"/>
<text x="239.56" y="169" class="bad" font-size="15" font-weight="600">5.39</text>
<text x="704" y="169" class="ink" font-size="15" text-anchor="end">30/30</text>
<text x="16" y="215" class="ink" font-size="15">在 3:1 缩小上</text>
<text x="16" y="233" class="ink" font-size="15">返回错误</text>
<rect class="badBg" x="210" y="200" width="400" height="30"/>
<rect class="bad" x="210" y="200" width="75.72" height="30"/>
<text x="293.72" y="221" class="bad" font-size="15" font-weight="600">18.93</text>
<text x="704" y="221" class="ink" font-size="15" text-anchor="end">30/30</text>
<text x="16" y="267" class="ink" font-size="15">在 3:1 缩小上</text>
<text x="16" y="285" class="ink" font-size="15">什么都不写</text>
<rect class="badBg" x="210" y="252" width="400" height="30"/>
<rect class="bad" x="210" y="252" width="71.48" height="30"/>
<text x="289.48" y="273" class="bad" font-size="15" font-weight="600">17.87</text>
<text x="704" y="273" class="ink" font-size="15" text-anchor="end">30/30</text>
<line class="rule" x1="210" y1="92" x2="210" y2="286" stroke-width="1.5"/>
<text x="210" y="304" class="muted" font-size="13" text-anchor="middle">0</text>
<text x="610" y="304" class="muted" font-size="13" text-anchor="middle">100</text>
<text x="16" y="332" class="muted" font-size="14">一次立即返回错误的调用被计为 16,469 倍的加速。四个版本都通过了 30 项正确性测试，</text>
<text x="16" y="351" class="muted" font-size="14">因为这些测试从不涉及被计时的那几种转换。</text>
<rect x="8" y="376" width="704" height="111" rx="8" class="accBox"/>
<text x="20" y="398" class="ink" font-size="14" font-weight="600">2. 当前的修复检查每次计时调用的输出；只要有一次失败，总分即为 0，</text>
<text x="20" y="417" class="ink" font-size="14" font-weight="600">与任务说明一致。</text>
<text x="20" y="436" class="ink" font-size="14" font-weight="400">它唯一一次并排对照运行（2 个 CPU，原始加速比）：一份跳过重复调用的代码通过了</text>
<text x="20" y="455" class="ink" font-size="14" font-weight="400">全部 30 项正确性测试，得 0（原始评分器为 1.04）；一份正确的提交仍得 1.02</text>
<text x="20" y="474" class="ink" font-size="14" font-weight="400">（原始评分器为 1.06）。上面三个未完成的版本没有在当前修复上运行。</text>
</svg>
