<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" role="img">
<title>42 of 100 points were the submission's own claims, so the task was removed</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">42 of 100 points were the submission's own claims, so the task was removed</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start">Task: estimate underground density from gravity data with the D-ABIC method. Score out of 100.</text>
<text x="16" y="88" class="ink" font-size="14" text-anchor="start" font-weight="600">Where the 100 points come from</text>
<rect x="16.0" y="100" width="240.8" height="44" class="goodBg"/><rect x="16.0" y="100" width="240.8" height="44" fill="none" class="goodS" stroke-width="2"/>
<text x="136.4" y="129" class="good" font-size="16" text-anchor="middle" font-weight="700">35</text>
<text x="24" y="168" class="good" font-size="13" text-anchor="start" font-weight="600">Recomputed by the checker</text>
<text x="24" y="187" class="ink" font-size="13" text-anchor="start">by running the code on</text>
<text x="24" y="206" class="ink" font-size="13" text-anchor="start">hidden test cases</text>
<rect x="256.8" y="100" width="289.0" height="44" class="badBg"/><rect x="256.8" y="100" width="289.0" height="44" fill="none" class="badS" stroke-width="2"/>
<text x="298.1" y="129" class="bad" font-size="18" text-anchor="middle" font-weight="700">12</text><text x="442.6" y="129" class="bad" font-size="18" text-anchor="middle" font-weight="700">30 · 42 in all</text>
<line x1="339.4" y1="100" x2="339.4" y2="144" class="badS" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="264.8" y="168" class="bad" font-size="13" text-anchor="start" font-weight="600">Read from the submission's own</text>
<text x="264.8" y="187" class="ink" font-size="13" text-anchor="start">results file and scored as written;</text>
<text x="264.8" y="206" class="ink" font-size="13" text-anchor="start">the checker never verifies them</text>
<rect x="545.8" y="100" width="158.2" height="44" class="warnBg"/><rect x="545.8" y="100" width="158.2" height="44" fill="none" class="warnS" stroke-width="2"/>
<text x="624.88" y="129" class="warn" font-size="16" text-anchor="middle" font-weight="700">23</text>
<text x="553.76" y="168" class="warn" font-size="13" text-anchor="start" font-weight="600">Other checks</text>
<text x="553.76" y="187" class="ink" font-size="13" text-anchor="start">code text: 3</text>
<text x="553.76" y="206" class="ink" font-size="13" text-anchor="start">behaviour monitor: 8</text>
<text x="553.76" y="225" class="ink" font-size="13" text-anchor="start">report keywords: 12</text>
<rect x="16" y="240" width="688" height="80" rx="8" class="badBg"/>
<text x="32" y="264" class="bad" font-size="15" text-anchor="start" font-weight="700">Why the task was removed rather than fixed</text>
<text x="32" y="286" class="ink" font-size="13.5" text-anchor="start">A sound fix would need the checker to recompute these 42 points itself from hidden data</text>
<text x="32" y="306" class="ink" font-size="13.5" text-anchor="start">instead of reading them from the submission. Without that, they reward claims, not work.</text>
<text x="16" y="346" class="muted" font-size="13" text-anchor="start">A second problem was fixed but did not save the task: one of two allowed, equivalent method forms</text>
<text x="16" y="364" class="muted" font-size="13" text-anchor="start">was quietly penalised (same strong work: 88.92 against 42.86 out of 100, from the checker's own rule).</text>
</svg>
