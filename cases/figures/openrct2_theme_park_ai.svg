<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Two bars show 69 of the promised 992 game days reached in the 120 s budget, and 120 s against the 1,667 s that 992 days would need.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="ink" x="16" y="30" font-size="18" font-weight="600">Promised about 4 game years, scored after 69 days</text>
<text class="muted" x="16" y="68" font-size="14">Game days per scenario</text>
<rect class="accBg" x="16" y="78" width="688" height="30"/><rect class="bad" x="16" y="78" width="48" height="30"/>
<text class="bad" x="72" y="130" font-size="15" font-weight="600" text-anchor="start">69 reached in 120 s</text>
<text class="acc" x="704" y="130" font-size="15" font-weight="600" text-anchor="end">992 days promised</text>
<text class="muted" x="16" y="180" font-size="14">Wall-clock seconds per scenario</text>
<rect class="accBg" x="16" y="190" width="688" height="30"/><rect class="bad" x="16" y="190" width="50" height="30"/>
<text class="bad" x="74" y="242" font-size="15" font-weight="600">120 s budget</text>
<text class="acc" x="704" y="242" font-size="15" font-weight="600" text-anchor="end">1,667 s needed</text>
<text class="muted" x="16" y="282" font-size="14">The score is a snapshot taken early in the game.</text>
</svg>
