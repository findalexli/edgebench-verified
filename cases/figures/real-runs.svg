<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 716" role="img">
<title>A real agent run, regraded: the run&#x27;s score moved in 2 of 7 tasks</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .accBg{fill:#e3eff4} .ioRing{stroke:#ffffff} .ioBand{fill:#eef2f4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .accBg{fill:#16303c} .ioRing{stroke:#152029} .ioBand{fill:#1c2a34}
  }
</style>

<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">A real agent run, regraded: the run&#x27;s score moved in 2 of 7 tasks</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start" font-weight="400">One four-hour Claude Opus 5.5 run per task, regraded with the original and the fixed checker.</text>
<circle cx="22" cy="78" r="5" class="bg mutedS" stroke-width="2"/>
<text x="34" y="82" class="ink" font-size="13" text-anchor="start" font-weight="400">original checker</text>
<circle cx="174.48" cy="78" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="186.48" y="82" class="ink" font-size="13" text-anchor="start" font-weight="400">fixed checker</text>
<circle cx="305.12" cy="78" r="5" class="bg accS" stroke-width="2" stroke-dasharray="2 2"/>
<text x="317.12" y="82" class="ink" font-size="13" text-anchor="start" font-weight="400">computed, not run</text>
<text x="214" y="100" class="ink" font-size="13" text-anchor="start" font-weight="600">The run&#x27;s kept score (out of 100)</text>
<text x="598" y="100" class="ink" font-size="13" text-anchor="middle" font-weight="600">Largest change for one submission</text>
<text x="214" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">0</text>
<text x="334" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">50</text>
<text x="454" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">100</text>
<text x="523" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">-25</text>
<text x="598" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">0</text>
<text x="673" y="116" class="muted" font-size="13" text-anchor="middle" font-weight="400">+25</text>
<line x1="214.0" y1="124" x2="214.0" y2="668" class="rule" stroke-width="1"/>
<line x1="334.0" y1="124" x2="334.0" y2="668" class="rule" stroke-width="1"/>
<line x1="454.0" y1="124" x2="454.0" y2="668" class="rule" stroke-width="1"/>
<line x1="598" y1="124" x2="598" y2="668" class="rule" stroke-width="1.5"/>
<text x="16" y="139.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Order Addition Permutation</text>
<text x="16" y="154.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Optimization</text>
<line x1="223.1" y1="142" x2="313.0" y2="142" class="mutedS" stroke-width="2"/>
<circle cx="223.1" cy="142" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="312.968" cy="142" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="322.968" y="146.5" class="ink" font-size="13" text-anchor="start" font-weight="400">3.79 → 41.24</text>
<text x="598" y="146.5" class="ink" font-size="13" text-anchor="middle" font-weight="400">0 (scores identical)</text>
<text x="214" y="167" class="muted" font-size="13" text-anchor="start" font-weight="400">Each submission keeps its own score; the fixed checker keeps a</text>
<text x="214" y="184" class="muted" font-size="13" text-anchor="start" font-weight="400">later, better one (9 submissions).</text>
<text x="16" y="213.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Integer Compression Codec</text>
<line x1="395.7" y1="209" x2="343.5" y2="209" class="mutedS" stroke-width="2"/>
<circle cx="395.7" cy="209" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="343.479" cy="209" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="405.733" y="213.5" class="ink" font-size="13" text-anchor="start" font-weight="400">75.72 → 53.95</text>
<rect x="509.0" y="203" width="89.0" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="604" y="213.5" class="ink" font-size="13" text-anchor="start" font-weight="400">−29.68</text>
<text x="214" y="234" class="muted" font-size="13" text-anchor="start" font-weight="400">Raw results rise 1.7–4×; the fixed 0–100 scale lowers the run&#x27;s</text>
<text x="214" y="251" class="muted" font-size="13" text-anchor="start" font-weight="400">score (37 submissions).</text>
<text x="16" y="280.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Lean Analysis Proofs</text>
<line x1="446.5" y1="276" x2="450.2" y2="276" class="mutedS" stroke-width="2"/>
<circle cx="446.5" cy="276" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="450.2" cy="276" r="5" class="bg accS" stroke-width="2" stroke-dasharray="2 2"/>
<text x="436.472" y="280.5" class="ink" font-size="13" text-anchor="end" font-weight="400">96.86 → 98.42</text>
<rect x="598.0" y="270" width="14.8" height="12" rx="2" class="bg accS" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="592" y="280.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+4.95</text>
<text x="214" y="301" class="muted" font-size="13" text-anchor="start" font-weight="400">Computed from the original checker&#x27;s saved verdicts, not run (20</text>
<text x="214" y="318" class="muted" font-size="13" text-anchor="start" font-weight="400">submissions).</text>
<text x="16" y="340.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Juliet Vulnerability</text>
<text x="16" y="355.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Analyzer</text>
<line x1="453.2" y1="343" x2="453.2" y2="343" class="mutedS" stroke-width="2"/>
<circle cx="453.2" cy="343" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="453.184" cy="343" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="443.184" y="347.5" class="ink" font-size="13" text-anchor="end" font-weight="400">99.66 = 99.66</text>
<rect x="598.0" y="337" width="75.8" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="347.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+25.26</text>
<text x="214" y="368" class="muted" font-size="13" text-anchor="start" font-weight="400">14 of 105 submissions changed; the best one did not.</text>
<text x="16" y="397.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Molecular Self Assembly</text>
<line x1="454.0" y1="393" x2="454.0" y2="393" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="393" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="393" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="397.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<rect x="598.0" y="387" width="36.7" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="397.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+12.22</text>
<text x="214" y="418" class="muted" font-size="13" text-anchor="start" font-weight="400">All 8 graded submissions rose; the run was already at the top of</text>
<text x="214" y="435" class="muted" font-size="13" text-anchor="start" font-weight="400">the scale (8 of 13 graded).</text>
<text x="16" y="464.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Tree Block Partitioning</text>
<line x1="454.0" y1="460" x2="454.0" y2="460" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="460" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="460" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="464.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="464.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="485" class="muted" font-size="13" text-anchor="start" font-weight="400">Differences come from timing near the time limit, under both</text>
<text x="214" y="502" class="muted" font-size="13" text-anchor="start" font-weight="400">checkers (13 of 25 graded).</text>
<text x="16" y="531.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Graph Node Classification</text>
<line x1="432.0" y1="527" x2="431.1" y2="527" class="mutedS" stroke-width="2"/>
<circle cx="432.0" cy="527" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="431.115" cy="527" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="421.115" y="531.5" class="ink" font-size="13" text-anchor="end" font-weight="400">90.85 → 90.43–90.60</text>
<text x="598" y="531.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="552" class="muted" font-size="13" text-anchor="start" font-weight="400">90.85 against 90.43–90.60 is timing noise (112 of 118 graded).</text>
<text x="16" y="574.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Schemathesis Config</text>
<text x="16" y="589.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Modernization</text>
<line x1="454.0" y1="577" x2="454.0" y2="577" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="577" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="577" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="581.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="581.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="602" class="muted" font-size="13" text-anchor="start" font-weight="400">All 30 submissions score the same under both checkers.</text>
<text x="16" y="631.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Borden Source Inversion</text>
<circle cx="346.3" cy="627" r="5" class="bg mutedS" stroke-width="2"/>
<text x="336.337" y="631.5" class="ink" font-size="13" text-anchor="end" font-weight="400">55.14</text>
<text x="598" y="631.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">cannot be regraded</text>
<text x="214" y="652" class="muted" font-size="13" text-anchor="start" font-weight="400">The fix changes the instructions, so old answers cannot be</text>
<text x="214" y="669" class="muted" font-size="13" text-anchor="start" font-weight="400">regraded; 60.10 on its 0–109 scale.</text>
<text x="16" y="690" class="muted" font-size="13" text-anchor="start" font-weight="400">It shows the problems happen to real agents, and sometimes do not. It does not measure the</text>
<text x="16" y="708" class="muted" font-size="13" text-anchor="start" font-weight="400">effect on the 12-hour leaderboard.</text>

</svg>
