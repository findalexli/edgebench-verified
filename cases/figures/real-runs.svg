<text x="16" y="139.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Order Addition Permutation</text>
<text x="16" y="154.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Optimization</text>
<line x1="223.1" y1="142" x2="313.0" y2="142" class="mutedS" stroke-width="2"/>
<circle cx="223.1" cy="142" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="312.968" cy="142" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="322.968" y="146.5" class="ink" font-size="13" text-anchor="start" font-weight="400">3.79 → 41.24</text>
<text x="598" y="146.5" class="ink" font-size="13" text-anchor="middle" font-weight="400">0 (scores identical)</text>
<text x="214" y="167" class="muted" font-size="13" text-anchor="start" font-weight="400">Each submission keeps its own score; the fixed checker keeps a</text>
<text x="214" y="184" class="muted" font-size="13" text-anchor="start" font-weight="400">later, better one (9 submissions).</text>
<text x="16" y="213.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Integer Compression Codec</text>
<line x1="386.6" y1="209" x2="343.5" y2="209" class="mutedS" stroke-width="2"/>
<circle cx="386.6" cy="209" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="343.479" cy="209" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="333.479" y="213.5" class="ink" font-size="13" text-anchor="end" font-weight="400">71.93–73.03 → 53.95</text>
<rect x="509.0" y="203" width="89.0" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="604" y="213.5" class="ink" font-size="13" text-anchor="start" font-weight="400">−29.68</text>
<text x="214" y="234" class="muted" font-size="13" text-anchor="start" font-weight="400">Raw results rise 1.7–4×; the fixed 0–100 scale lowers the run&#x27;s</text>
<text x="214" y="251" class="muted" font-size="13" text-anchor="start" font-weight="400">score; the run itself recorded 75.72 on its own machine (37</text>
<text x="214" y="268" class="muted" font-size="13" text-anchor="start" font-weight="400">submissions).</text>
<text x="16" y="297.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Lean Analysis Proofs</text>
<line x1="446.5" y1="293" x2="450.2" y2="293" class="mutedS" stroke-width="2"/>
<circle cx="446.5" cy="293" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="450.2" cy="293" r="5" class="bg accS" stroke-width="2" stroke-dasharray="2 2"/>
<text x="436.472" y="297.5" class="ink" font-size="13" text-anchor="end" font-weight="400">96.86 → 98.42</text>
<rect x="598.0" y="287" width="14.8" height="12" rx="2" class="bg accS" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="592" y="297.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+4.95</text>
<text x="214" y="318" class="muted" font-size="13" text-anchor="start" font-weight="400">Computed from the original checker&#x27;s saved verdicts, not run (20</text>
<text x="214" y="335" class="muted" font-size="13" text-anchor="start" font-weight="400">submissions).</text>
<text x="16" y="357.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Juliet Vulnerability</text>
<text x="16" y="372.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Analyzer</text>
<line x1="453.2" y1="360" x2="453.2" y2="360" class="mutedS" stroke-width="2"/>
<circle cx="453.2" cy="360" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="453.184" cy="360" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="443.184" y="364.5" class="ink" font-size="13" text-anchor="end" font-weight="400">99.66 = 99.66</text>
<rect x="598.0" y="354" width="75.8" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="364.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+25.26</text>
<text x="214" y="385" class="muted" font-size="13" text-anchor="start" font-weight="400">14 of 105 submissions changed; the best one did not.</text>
<text x="16" y="414.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Molecular Self Assembly</text>
<line x1="448.5" y1="410" x2="454.0" y2="410" class="mutedS" stroke-width="2"/>
<circle cx="448.5" cy="410" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="410" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="438.511" y="414.5" class="ink" font-size="13" text-anchor="end" font-weight="400">95.91–100 → 100</text>
<rect x="598.0" y="404" width="36.7" height="12" rx="2" class="acc" stroke-width="1.5"/>
<text x="592" y="414.5" class="ink" font-size="13" text-anchor="end" font-weight="400">+12.22</text>
<text x="214" y="435" class="muted" font-size="13" text-anchor="start" font-weight="400">All 8 graded submissions rose; the kept one was already near the</text>
<text x="214" y="452" class="muted" font-size="13" text-anchor="start" font-weight="400">top of the scale; the run itself recorded 100 on its own machine</text>
<text x="214" y="469" class="muted" font-size="13" text-anchor="start" font-weight="400">(8 of 13 graded).</text>
<text x="16" y="498.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Tree Block Partitioning</text>
<line x1="454.0" y1="494" x2="454.0" y2="494" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="494" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="494" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="498.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="498.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="519" class="muted" font-size="13" text-anchor="start" font-weight="400">Differences come from timing near the time limit, under both</text>
<text x="214" y="536" class="muted" font-size="13" text-anchor="start" font-weight="400">checkers (13 of 25 graded).</text>
<text x="16" y="565.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Graph Node Classification</text>
<line x1="431.2" y1="561" x2="431.1" y2="561" class="mutedS" stroke-width="2"/>
<circle cx="431.2" cy="561" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="431.115" cy="561" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="421.115" y="565.5" class="ink" font-size="13" text-anchor="end" font-weight="400">90.44–90.60 → 90.43–90.60</text>
<text x="598" y="565.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="586" class="muted" font-size="13" text-anchor="start" font-weight="400">The spread is timing noise under both checkers; the run itself</text>
<text x="214" y="603" class="muted" font-size="13" text-anchor="start" font-weight="400">recorded 90.85 on its own machine (112 of 118 graded).</text>
<text x="16" y="625.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Schemathesis Config</text>
<text x="16" y="640.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Modernization</text>
<line x1="454.0" y1="628" x2="454.0" y2="628" class="mutedS" stroke-width="2"/>
<circle cx="454.0" cy="628" r="5" class="bg mutedS" stroke-width="2"/>
<circle cx="454" cy="628" r="5" class="acc ioRing" stroke-width="1.5"/>
<text x="444" y="632.5" class="ink" font-size="13" text-anchor="end" font-weight="400">100 = 100</text>
<text x="598" y="632.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">problem never occurred</text>
<text x="214" y="653" class="muted" font-size="13" text-anchor="start" font-weight="400">All 30 submissions score the same under both checkers.</text>
<text x="16" y="682.5" class="ink" font-size="13" text-anchor="start" font-weight="600">Borden Source Inversion</text>
<circle cx="346.3" cy="678" r="5" class="bg mutedS" stroke-width="2"/>
<text x="336.337" y="682.5" class="ink" font-size="13" text-anchor="end" font-weight="400">55.14 (raw 60.10)</text>
<text x="598" y="682.5" class="muted" font-size="13" text-anchor="middle" font-weight="400">same grader; needs a new run</text>
<text x="214" y="703" class="muted" font-size="13" text-anchor="start" font-weight="400">Grader unchanged, so old answers score the same (60.10 raw, 55.14</text>
<text x="214" y="720" class="muted" font-size="13" text-anchor="start" font-weight="400">out of 100); the fix changes the instructions, so only new runs</text>
<text x="214" y="737" class="muted" font-size="13" text-anchor="start" font-weight="400">can show its effect.</text>
<text x="16" y="762" class="muted" font-size="13" text-anchor="start" font-weight="400">Both checkers regraded on our machines; a range is the spread over three gradings.</text>
<text x="16" y="780" class="muted" font-size="13" text-anchor="start" font-weight="400">The problems reach real agent runs, though not every time. The run does not measure the effect</text>
<text x="16" y="798" class="muted" font-size="13" text-anchor="start" font-weight="400">on the 12-hour leaderboard.</text>

</svg>
