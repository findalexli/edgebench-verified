<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Bars: the same honest analyzer scores 69.26 when it returns the undocumented array shape and 35.59 when it keeps the starter shape.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="16" y="30" font-size="18" font-weight="700" class="ink">Same code, different undocumented return shape</text>
<text x="16" y="72" font-size="15" class="ink">Returns [{level, message}]</text>
<rect x="16" y="82" width="526" height="34" class="good"/>
<text x="552" y="106" font-size="17" font-weight="700" class="ink">69.26<tspan class="muted" font-size="14" font-weight="400"> out of 100</tspan></text>
<text x="16" y="154" font-size="15" class="ink">Keeps starter shape {ok, errors, warnings, program}</text>
<rect x="16" y="164" width="270.4" height="34" class="bad"/>
<text x="296" y="188" font-size="17" font-weight="700" class="ink">35.59<tspan class="muted" font-size="14" font-weight="400"> out of 100</tspan></text>

<rect x="16" y="226" width="688" height="58" rx="8" class="warnBg"/>
<text x="32" y="250" font-size="15" class="ink">Type-system cases passed: 128/128 versus 0.</text>
<text x="32" y="272" font-size="15" class="ink">No file the solver sees names the shape. The fix documents it.</text>
</svg>
