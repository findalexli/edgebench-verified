<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Bars show an honest but unfinished library scoring 5.39, 18.93 and 17.87 out of 100 on the original grader because failed calls counted as fast; the fixed version scores 0.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="ink" x="16" y="30" font-size="18" font-weight="600">Broken code scored as fast code</text>
<text class="muted" x="200" y="62" font-size="14">score out of 100, original grader</text>
<text class="ink" x="16" y="102" font-size="15">Fails RGBA→RGB24</text>
<rect class="badBg" x="200" y="80" width="400" height="30"/><rect class="bad" x="200" y="80" width="21.56" height="30"/>
<text class="bad" x="229.56" y="102" font-size="15" font-weight="600">5.39</text>
<text class="good" x="704" y="102" font-size="15" font-weight="600" text-anchor="end">fixed: 0</text>
<text class="ink" x="16" y="152" font-size="15">Fails 3:1 downscale</text>
<rect class="badBg" x="200" y="130" width="400" height="30"/><rect class="bad" x="200" y="130" width="75.72" height="30"/>
<text class="bad" x="283.72" y="152" font-size="15" font-weight="600">18.93</text>
<text class="good" x="704" y="152" font-size="15" font-weight="600" text-anchor="end">fixed: 0</text>
<text class="ink" x="16" y="202" font-size="15">Does nothing, 3:1</text>
<rect class="badBg" x="200" y="180" width="400" height="30"/><rect class="bad" x="200" y="180" width="71.48" height="30"/>
<text class="bad" x="279.48" y="202" font-size="15" font-weight="600">17.87</text>
<text class="good" x="704" y="202" font-size="15" font-weight="600" text-anchor="end">fixed: 0</text>
<line class="rule" x1="200" y1="76" x2="200" y2="226" stroke-width="1.5"/>
<text class="muted" x="200" y="246" font-size="14" text-anchor="middle">0</text><text class="muted" x="600" y="246" font-size="14" text-anchor="middle">100</text>
<text class="muted" x="16" y="280" font-size="14">An error return was timed as a 16,469× speedup.</text>
</svg>
