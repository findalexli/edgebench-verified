<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img">
<title>EdgeBench's scoring pipeline: the agent submits work, a hidden grader produces a raw result, the raw result is converted to 0 to 100, each run keeps its best score so far, the valid runs of a task (three per model) are averaged, and then the tasks are averaged. Four markers show where a grader can go wrong.</title>
<style>
  .ink{fill:#1b1f23} .muted{fill:#5f6368} .box{fill:#f6f7f9;stroke:#c9ced4} .arr{stroke:#8a9097;fill:none} .head{fill:#8a9097}
  .mk{fill:#9b2c2c} .mkt{fill:#ffffff}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .box{fill:#1b2630;stroke:#3a4a57} .arr{stroke:#7d8b96} .head{fill:#7d8b96}
    .mk{fill:#f08a7c} .mkt{fill:#152029}
  }
</style>
<g>
<rect class="box" x="0.5" y="40.5" width="135" height="68" rx="6"/>
<text class="ink" x="68.0" y="69" text-anchor="middle" font-size="16" font-weight="600">The agent</text>
<text class="muted" x="68.0" y="90" text-anchor="middle" font-size="14">submits work</text>
<rect class="box" x="156.5" y="40.5" width="135" height="68" rx="6"/>
<text class="ink" x="224.0" y="69" text-anchor="middle" font-size="16" font-weight="600">Hidden grader</text>
<text class="muted" x="224.0" y="90" text-anchor="middle" font-size="14">raw result</text>
<rect class="box" x="312.5" y="40.5" width="135" height="68" rx="6"/>
<text class="ink" x="380.0" y="69" text-anchor="middle" font-size="16" font-weight="600">0–100 scale</text>
<text class="muted" x="380.0" y="90" text-anchor="middle" font-size="14">reference points</text>
<rect class="box" x="468.5" y="40.5" width="135" height="68" rx="6"/>
<text class="ink" x="536.0" y="69" text-anchor="middle" font-size="16" font-weight="600">Best so far</text>
<text class="muted" x="536.0" y="90" text-anchor="middle" font-size="14">kept for each run</text>
<rect class="box" x="624.5" y="40.5" width="135" height="68" rx="6"/>
<text class="ink" x="692.0" y="64" text-anchor="middle" font-size="16" font-weight="600">Average</text>
<text class="muted" x="692.0" y="83" text-anchor="middle" font-size="14">valid runs (of 3),</text>
<text class="muted" x="692.0" y="100" text-anchor="middle" font-size="14">then all tasks</text>
<path class="arr" stroke-width="1.5" d="M137 74 H149"/><path class="head" d="M156 74 l-7 -4 v8 z"/>
<path class="arr" stroke-width="1.5" d="M293 74 H305"/><path class="head" d="M312 74 l-7 -4 v8 z"/>
<path class="arr" stroke-width="1.5" d="M449 74 H461"/><path class="head" d="M468 74 l-7 -4 v8 z"/>
<path class="arr" stroke-width="1.5" d="M605 74 H617"/><path class="head" d="M624 74 l-7 -4 v8 z"/>
<circle class="mk" cx="207.0" cy="20" r="12"/><text class="mkt" x="207.0" y="25" text-anchor="middle" font-size="13" font-weight="600">1</text>
<circle class="mk" cx="241.0" cy="20" r="12"/><text class="mkt" x="241.0" y="25" text-anchor="middle" font-size="13" font-weight="600">2</text>
<circle class="mk" cx="380.0" cy="20" r="12"/><text class="mkt" x="380.0" y="25" text-anchor="middle" font-size="13" font-weight="600">3</text>
<circle class="mk" cx="536.0" cy="20" r="12"/><text class="mkt" x="536.0" y="25" text-anchor="middle" font-size="13" font-weight="600">4</text>
<circle class="mk" cx="11" cy="147" r="10"/><text class="mkt" x="11" y="152" text-anchor="middle" font-size="13" font-weight="600">1</text>
<text class="ink" x="30" y="152" font-size="15.5">Accepts wrong work</text><text class="muted" x="30" y="173" font-size="14">Exchange Core, Jagua Nesting</text>
<circle class="mk" cx="399" cy="147" r="10"/><text class="mkt" x="399" y="152" text-anchor="middle" font-size="13" font-weight="600">2</text>
<text class="ink" x="418" y="152" font-size="15.5">Rejects correct work, or an unstated rule</text><text class="muted" x="418" y="173" font-size="14">SMT Solver, Borden, Triangulation, Warehouse</text>
<circle class="mk" cx="11" cy="209" r="10"/><text class="mkt" x="11" y="214" text-anchor="middle" font-size="13" font-weight="600">3</text>
<text class="ink" x="30" y="214" font-size="15.5">Scale unreachable or mismeasured</text><text class="muted" x="30" y="235" font-size="14">Treant Forest, Integer Codec</text>
<circle class="mk" cx="399" cy="209" r="10"/><text class="mkt" x="399" y="214" text-anchor="middle" font-size="13" font-weight="600">4</text>
<text class="ink" x="418" y="214" font-size="15.5">Keeps the wrong submission</text><text class="muted" x="418" y="235" font-size="14">Order Addition</text>
</g></svg>
