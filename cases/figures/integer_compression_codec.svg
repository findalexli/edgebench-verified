<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Left: the starter should score 1.0 but scores 0.24 on the original grader and 0.98 on the fixed one. Right: stored baseline of 5.13 bits per integer is below the 8-bit minimum and far from the measured 38.98.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .warnS{stroke:#9a6510} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .warnS{stroke:#e0a64a} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="16" y="30" font-size="18" font-weight="700" class="ink">The baseline numbers cannot be real</text>
<text x="16" y="62" font-size="14" class="muted">Starter score (documented: 1.0)</text>
<text x="16" y="102" font-size="15" class="ink">Original</text>
<rect x="96" y="82" width="64" height="26" class="bad"/><text x="168" y="102" font-size="16" font-weight="700" class="ink">0.24</text>
<text x="16" y="152" font-size="15" class="ink">Fixed</text>
<rect x="96" y="132" width="260" height="26" class="good"/><text x="364" y="152" font-size="16" font-weight="700" class="ink">0.98</text>
<line x1="356" y1="72" x2="356" y2="172" class="inkS" stroke-width="1" stroke-dasharray="4 4"/>
<text x="356" y="190" font-size="14" text-anchor="middle" class="muted">1.0</text>
<line x1="410" y1="50" x2="410" y2="284" class="rule" stroke-width="1.5"/>
<text x="426" y="62" font-size="14" class="muted">Bits per integer, docids</text>
<text x="426" y="100" font-size="14" class="ink">Stored "Varint"</text>
<rect x="426" y="108" width="31" height="24" class="bad"/><text x="486" y="127" font-size="16" font-weight="700" class="ink">5.13</text>
<text x="426" y="170" font-size="14" class="ink">Starter, measured</text>
<rect x="426" y="178" width="234" height="24" class="acc"/><text x="650" y="196" font-size="16" font-weight="700" text-anchor="end" class="bg">38.98</text>
<line x1="474" y1="104" x2="474" y2="136" class="warnS" stroke-width="2"/><line x1="474" y1="174" x2="474" y2="206" class="warnS" stroke-width="2"/>
<text x="426" y="262" font-size="14" class="warn">8 bits = byte-varint minimum</text>
<rect x="16" y="226" width="368" height="44" rx="8" class="warnBg"/>
<text x="32" y="253" font-size="15" class="ink">Fixed: measure the starter in the same run</text>
</svg>
