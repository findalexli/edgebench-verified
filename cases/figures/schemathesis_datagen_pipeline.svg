<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>The original date test accepts a nonsense date string and all 50 dates from a generator whose dates are about 90% impossible; the fixed test accepts only the 5 valid ones.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
  .t{font-size:17px;font-weight:600} .b{font-weight:600}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="t ink" x="16" y="30">Original test only checks the shape of an HTTP date</text>
<rect class="badBg badS" x="16" y="46" width="688" height="44" rx="6" stroke-width="1.5"/>
<text class="ink b" x="360" y="75" text-anchor="middle">"Abc, 99 Xyz 0000 99:99:99 GMT"</text>
<text class="bad b" x="32" y="122">Original: accepted ✓</text>
<text class="good b" x="400" y="122">Fixed: rejected ✗</text>
<text class="muted" x="16" y="160">Of 50 dates drawn field by field (about 90% impossible), accepted:</text>
<text class="ink" x="16" y="197">Original</text>
<rect class="bad" x="120" y="180" width="560" height="22" rx="3"/>
<text class="bg b" x="660" y="197" text-anchor="end">50 / 50</text>
<text class="ink" x="16" y="237">Fixed</text>
<rect class="good" x="120" y="220" width="56" height="22" rx="3"/>
<text class="good b" x="186" y="237">5 / 50</text>
<text class="muted" x="16" y="284">About 1% of the score.</text>
</svg>
