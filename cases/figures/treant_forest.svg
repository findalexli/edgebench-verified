<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img">
<title>Treant Forest score scale</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="40" y="26" class="muted" font-size="15" text-anchor="start" font-weight="400">Original score scale (0 to 100)</text>
<rect x="40" y="70" width="134.5" height="28" class="goodBg"/><rect x="174.5" y="70" width="505.5" height="28" class="badBg"/>
<text x="427" y="89" class="bad" font-size="15" text-anchor="middle" font-weight="600">unreachable</text>
<line x1="174.5" y1="46" x2="174.5" y2="98" class="inkS" stroke-width="2"/>
<text x="182" y="50" class="ink" font-size="14" text-anchor="start" font-weight="600">Turn cap: 92,304 total turns = 21.02</text>
<line x1="40" y1="98" x2="40" y2="106" class="inkS" stroke-width="1.5"/>
<text x="40" y="124" class="ink" font-size="15" text-anchor="start" font-weight="600">0</text>
<text x="40" y="142" class="muted" font-size="14" text-anchor="start" font-weight="400">5,369</text>
<line x1="168" y1="98" x2="168" y2="106" class="inkS" stroke-width="1.5"/>
<text x="168" y="124" class="ink" font-size="15" text-anchor="middle" font-weight="600">20</text>
<text x="168" y="142" class="muted" font-size="14" text-anchor="middle" font-weight="400">88,189</text>
<line x1="552" y1="98" x2="552" y2="106" class="inkS" stroke-width="1.5"/>
<text x="552" y="124" class="ink" font-size="15" text-anchor="middle" font-weight="600">80</text>
<text x="552" y="142" class="muted" font-size="14" text-anchor="middle" font-weight="400">330,195</text>
<line x1="680" y1="98" x2="680" y2="106" class="inkS" stroke-width="1.5"/>
<text x="680" y="124" class="ink" font-size="15" text-anchor="end" font-weight="600">100</text>
<text x="680" y="142" class="muted" font-size="14" text-anchor="end" font-weight="400">451,198</text>
<text x="40" y="166" class="muted" font-size="13" text-anchor="start" font-weight="400">Bold: score out of 100. Grey: total turns needed for that score.</text>
<text x="40" y="192" class="muted" font-size="15" text-anchor="start" font-weight="400">Fixed score scale (0 to 100)</text>
<rect x="40" y="204" width="640" height="28" class="goodBg"/>
<text x="40" y="254" class="ink" font-size="15" text-anchor="start" font-weight="600">0 = 3,418 turns (starter)</text>
<text x="680" y="254" class="ink" font-size="15" text-anchor="end" font-weight="600">100 = 92,304 turns (the cap)</text>

</svg>
