<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 578" role="img">
<title>The textbook model scores 7; the checker's unstated model scores 31</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .mutedS{stroke:#566773}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .mutedS{stroke:#95a6b1}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text x="16" y="30" class="ink" font-size="18" text-anchor="start" font-weight="700">The textbook model scores 7; the checker's unstated model scores 31</text>
<text x="16" y="54" class="muted" font-size="14" text-anchor="start">Task: find a hidden underground pollution source from monitoring-well readings.</text>
<rect x="16" y="68" width="300" height="136" rx="8" class="accBg"/>
<text x="30" y="92" class="acc" font-size="14" text-anchor="start" font-weight="700">What the instructions say</text>
<text x="30" y="116" class="ink" font-size="14" text-anchor="start">Build the textbook groundwater model</text>
<text x="30" y="136" class="ink" font-size="14" text-anchor="start">(the advection–dispersion equation).</text>
<text x="30" y="156" class="ink" font-size="14" text-anchor="start">C0 is a concentration, in mg/L.</text>
<text x="30" y="176" class="ink" font-size="14" text-anchor="start">The checker uses a “hidden” model.</text>
<rect x="328" y="68" width="376" height="136" rx="8" class="badBg"/>
<text x="342" y="92" class="bad" font-size="14" text-anchor="start" font-weight="700">What the checker's model does (never stated)</text>
<text x="342" y="114" class="ink" font-size="14" text-anchor="start">• treats a mass rate as a mass</text>
<text x="342" y="133" class="ink" font-size="14" text-anchor="start">• ignores soil porosity</text>
<text x="342" y="152" class="ink" font-size="14" text-anchor="start">• same total mass for any release duration</text>
<text x="342" y="171" class="ink" font-size="14" text-anchor="start">• reports mg/m³ as mg/L</text>
<text x="342" y="190" class="ink" font-size="14" text-anchor="start">• puts the source on one face of its box</text>
<text x="16" y="228" class="muted" font-size="13" text-anchor="start">The public data fit both models equally well, so a solver cannot tell which one the checker uses.</text>
<text x="16" y="262" class="ink" font-size="14" text-anchor="start" font-weight="600">One-shot fit to the public data</text>
<text x="16" y="280" class="muted" font-size="13" text-anchor="start">baseline, and the same fit with two physics models</text>
<text x="340" y="262" class="ink" font-size="14" text-anchor="start" font-weight="600">A real agent run: 36 submissions in 4 hours</text>
<text x="340" y="280" class="muted" font-size="13" text-anchor="start">after each one, the checker reports its error on hidden wells</text>
