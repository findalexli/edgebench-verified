<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" role="img"><title>Phase 3 test results: the original tests pass both a correct decorator and a wrapper at 15/15; the fixed tests fail the wrapper at 15/16.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
  .t{font-size:17px;font-weight:600} .b{font-weight:600}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="t ink" x="16" y="30">Does @schemathesis.metric return the function unchanged?</text>
<text class="muted b" x="250" y="66">Original tests</text>
<text class="muted b" x="480" y="66">Fixed tests</text>
<text class="ink" x="16" y="105">Correct decorator</text>
<rect class="goodBg goodS" x="250" y="84" width="190" height="30" rx="4" stroke-width="1.5"/><text class="good b" x="345" y="105" text-anchor="middle">15/15 ✓</text>
<rect class="goodBg goodS" x="480" y="84" width="190" height="30" rx="4" stroke-width="1.5"/><text class="good b" x="575" y="105" text-anchor="middle">16/16 ✓</text>
<text class="ink" x="16" y="153">Wrapper (wrong)</text>
<rect class="goodBg goodS" x="250" y="132" width="190" height="30" rx="4" stroke-width="1.5"/><text class="good b" x="345" y="153" text-anchor="middle">15/15 ✓</text>
<rect class="badBg badS" x="480" y="132" width="190" height="30" rx="4" stroke-width="1.5"/><text class="bad b" x="575" y="153" text-anchor="middle">15/16 ✗</text>
<text class="bad b" x="16" y="214">Original: a wrong wrapper scores the same as the correct decorator.</text>
<text class="muted" x="16" y="244">Worth one test: 1/160 of the score.</text>
</svg>
