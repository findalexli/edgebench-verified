<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img">
<title>Order Addition best submission</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="40" y="26" class="muted" font-size="15" text-anchor="start" font-weight="400">Two valid submissions, in order</text>
<text x="16" y="96" class="ink" font-size="15" text-anchor="start" font-weight="600">Original</text>
<text x="16" y="115" class="ink" font-size="15" text-anchor="start" font-weight="600">grader</text>
<rect x="120" y="46" width="230" height="92" rx="6" class="warnBg" />
<rect x="120" y="46" width="230" height="92" rx="6" fill="none" class="warnS" stroke-width="3"/>
<text x="132" y="70" class="ink" font-size="15" text-anchor="start" font-weight="600">1st: order 1, 2, …, 1000</text>
<text x="132" y="90" class="ink" font-size="14" text-anchor="start" font-weight="400">score 3.3 × 10⁻⁹</text>
<text x="132" y="108" class="muted" font-size="14" text-anchor="start" font-weight="400">4/5 tests (one always fails)</text>
<text x="132" y="128" class="warn" font-size="14" text-anchor="start" font-weight="600">kept as best (stuck)</text>
<rect x="420" y="46" width="230" height="92" rx="6" class="badBg" />
<rect x="420" y="46" width="230" height="92" rx="6" fill="none" class="badS" stroke-width="3"/>
<text x="432" y="70" class="ink" font-size="15" text-anchor="start" font-weight="600">2nd: order found by search</text>
<text x="432" y="90" class="ink" font-size="14" text-anchor="start" font-weight="400">score 0.0093733018</text>
<text x="432" y="108" class="muted" font-size="14" text-anchor="start" font-weight="400">4/5 tests (one always fails)</text>
<text x="432" y="128" class="bad" font-size="14" text-anchor="start" font-weight="600">better, but ignored</text>
<path d="M358 92 L406 92 M398 86 L407 92 L398 98" fill="none" class="inkS" stroke-width="2"/>
<text x="16" y="212" class="ink" font-size="15" text-anchor="start" font-weight="600">Fixed</text>
<text x="16" y="231" class="ink" font-size="15" text-anchor="start" font-weight="600">version</text>
<rect x="120" y="162" width="230" height="92" rx="6" class="accBg" />
<rect x="120" y="162" width="230" height="92" rx="6" fill="none" class="rule" stroke-width="1.5"/>
<text x="132" y="186" class="ink" font-size="15" text-anchor="start" font-weight="600">1st: order 1, 2, …, 1000</text>
<text x="132" y="206" class="ink" font-size="14" text-anchor="start" font-weight="400">score 3.3 × 10⁻⁹</text>
<text x="132" y="224" class="muted" font-size="14" text-anchor="start" font-weight="400">5/5 tests</text>
<text x="132" y="244" class="muted" font-size="14" text-anchor="start" font-weight="600">earlier, beaten</text>
<rect x="420" y="162" width="230" height="92" rx="6" class="goodBg" />
<rect x="420" y="162" width="230" height="92" rx="6" fill="none" class="goodS" stroke-width="3"/>
<text x="432" y="186" class="ink" font-size="15" text-anchor="start" font-weight="600">2nd: order found by search</text>
<text x="432" y="206" class="ink" font-size="14" text-anchor="start" font-weight="400">score 0.0093733018</text>
<text x="432" y="224" class="muted" font-size="14" text-anchor="start" font-weight="400">5/5 tests</text>
<text x="432" y="244" class="good" font-size="14" text-anchor="start" font-weight="600">kept as best</text>
<path d="M358 208 L406 208 M398 202 L407 208 L398 214" fill="none" class="inkS" stroke-width="2"/>

</svg>
