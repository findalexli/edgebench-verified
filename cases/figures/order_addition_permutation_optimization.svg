<text x="16" y="26" class="ink" font-size="17" text-anchor="start" font-weight="600">An outdated file check fails every submission,</text>
<text x="16" y="48" class="ink" font-size="17" text-anchor="start" font-weight="600">so a real agent run keeps 3.79 out of 100 instead of 41.24</text>
<text x="16" y="74" class="muted" font-size="14" text-anchor="start" font-weight="400">Task: put the numbers 1 to 1000 in an order that makes a hidden cost as small as possible.</text>
<text x="16" y="94" class="muted" font-size="14" text-anchor="start" font-weight="400">One of the 5 tests expects an older version of a helper file, so it fails for everyone.</text>
