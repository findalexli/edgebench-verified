<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" role="img">
<title>Warehouse Routing time limit</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="40" y="26" class="muted" font-size="15" text-anchor="start" font-weight="400">Time allowed per input (5 test cases)</text>
<line x1="296.0" y1="56" x2="296.0" y2="100" class="inkS" stroke-width="2"/>
<text x="288.0" y="52" class="ink" font-size="14" text-anchor="end" font-weight="600">Enforced: 60 s</text>
<line x1="680" y1="56" x2="680" y2="100" class="inkS" stroke-width="2"/>
<text x="680" y="52" class="ink" font-size="14" text-anchor="end" font-weight="600">Promised: 5 × 30 s = 150 s</text>
<rect x="40" y="100" width="256.0" height="30" class="goodBg"/><rect x="296.0" y="100" width="384.0" height="30" class="badBg"/>
<text x="168.0" y="121" class="good" font-size="15" text-anchor="middle" font-weight="600">scored</text>
<text x="488.0" y="121" class="bad" font-size="15" text-anchor="middle" font-weight="600">promised but scored 0</text>
<text x="40" y="152" class="muted" font-size="14" text-anchor="start" font-weight="400">0 s</text>
<text x="296.0" y="152" class="muted" font-size="14" text-anchor="middle" font-weight="400">60 s</text>
<text x="680" y="152" class="muted" font-size="14" text-anchor="end" font-weight="400">150 s</text>
<line x1="317.3" y1="188" x2="317.3" y2="160" class="badS" stroke-width="2.5"/><path d="M311.3 167 L317.3 157 L323.3 167 Z" class="bad"/>
<text x="40" y="212" class="bad" font-size="15" text-anchor="start" font-weight="600">Test submission: 13 s per test case, within the promise, times out.</text>
<text x="40" y="234" class="ink" font-size="14" text-anchor="start" font-weight="400">Original grader: 50 timeouts, whole submission invalid.</text>
<text x="40" y="256" class="good" font-size="14" text-anchor="start" font-weight="600">Fixed version: limit 150 s, all 50 inputs scored.</text>

</svg>
