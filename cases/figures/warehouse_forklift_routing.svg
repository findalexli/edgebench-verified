<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img">
<title>Promised 150 seconds, cut off at 60: solutions that use their time get no score</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78} .onbar{fill:#ffffff}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b} .warnS{stroke:#9a6510} .ruleS{stroke:#d3dbe0}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4} .ruleF{fill:#eef2f4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3} .onbar{fill:#10181f}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed} .warnS{stroke:#e0a64a} .ruleS{stroke:#2a3843}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c} .ruleF{fill:#1d2a34}
  }
</style>
<text x="16" y="24" class="ink" font-size="15" font-weight="600">Promised 150 seconds, cut off at 60: solutions that use their time get no score</text>
<text x="16" y="46" class="muted" font-size="14">Each input has 5 test cases, and the instructions promise 30 s per case: 150 s per input.</text>
<text x="16" y="80" class="muted" font-size="14">Time per input on EdgeBench's 4-CPU setting (8 inputs run at once)</text>
<text x="16" y="132" class="ink" font-size="15" font-weight="600">Original checker</text>
<rect x="160" y="112" width="104.0" height="30" class="acc"/>
<rect x="264.0" y="112" width="104.0" height="30" class="accBg"/>
<rect x="368.0" y="112" width="312.0" height="30" class="badBg"/>
<text x="524.0" y="132" class="bad" font-size="14" font-weight="600" text-anchor="middle">promised, but timed out</text>
<line x1="368.0" y1="104" x2="368.0" y2="150" class="badS" stroke-width="2.5"/>
<text x="362.0" y="100" class="bad" font-size="14" font-weight="600" text-anchor="end">60 s limit</text>
<text x="160.0" y="166" class="acc" font-size="13" font-weight="600">≈30 s of computing (half a CPU per input), then the cut-off</text>
<text x="16" y="216" class="ink" font-size="15" font-weight="600">Fixed checker</text>
<rect x="160" y="196" width="520.0" height="30" class="good"/>
<text x="170" y="216" class="onbar" font-size="14" font-weight="600">150 s limit; at most 4 inputs at once, one CPU each</text>
<text x="160.0" y="248" class="muted" font-size="13" text-anchor="start">0 s</text>
<text x="264.0" y="248" class="muted" font-size="13" text-anchor="middle">30 s</text>
<text x="368.0" y="248" class="muted" font-size="13" text-anchor="middle">60 s</text>
<text x="680.0" y="248" class="muted" font-size="13" text-anchor="end">150 s</text>
<line x1="16" y1="266" x2="704" y2="266" class="rule" stroke-width="1"/>
<text x="16" y="290" class="muted" font-size="14">Measured: same test submissions on both checkers</text>
<text x="470" y="290" class="muted" font-size="14" text-anchor="middle">Original checker</text>
<text x="704" y="290" class="muted" font-size="14" text-anchor="end">Fixed checker</text>
<text x="16" y="316" class="ink" font-size="14">Waits 13 s per case (65 s per input)</text>
<text x="470" y="316" class="bad" font-size="14" font-weight="600" text-anchor="middle">all 50 time out: no score</text>
<text x="704" y="316" class="good" font-size="14" font-weight="600" text-anchor="end">all 50 scored</text>
<text x="16" y="340" class="ink" font-size="14">Computes 80 s per input</text>
<text x="470" y="340" class="bad" font-size="14" font-weight="600" text-anchor="middle">all 50 time out: no score</text>
<text x="704" y="340" class="good" font-size="14" font-weight="600" text-anchor="end">all 50 scored</text>
<text x="16" y="364" class="ink" font-size="14">Computes 140 s per input</text>
<text x="470" y="364" class="bad" font-size="14" font-weight="600" text-anchor="middle">all 50 time out: no score</text>
<text x="704" y="364" class="good" font-size="14" font-weight="600" text-anchor="end">all 50 scored</text>
<rect x="16" y="380" width="688" height="54" rx="6" class="warnBg"/>
<text x="28" y="402" class="ink" font-size="13">Documented, not fixed: no valid answer can score above about 30.6 out of 100 (30.3 before the</text>
<text x="28" y="422" class="ink" font-size="13">per-input scores are rounded). Higher scores need shorter routes than any valid answer has (proved).</text>
</svg>
