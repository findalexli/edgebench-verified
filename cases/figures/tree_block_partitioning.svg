<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Two cards compare a product of a value with a copy, which is correct at 3714, and a product of a value with itself, which gives 6190; bars show a sub-problem 2 score of 0.25 on the original library and 5.00 on the fixed one.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="ink" x="16" y="30" font-size="18" font-weight="600">Multiplying a value by itself gives the wrong answer</text>
<rect class="goodBg" x="16" y="50" width="332" height="100" rx="8"/>
<text class="ink" x="32" y="82" font-size="16" font-weight="600">y *= copy of y</text>
<text class="ink" x="32" y="112" font-size="16">(2, 0, 3, 3714)</text>
<text class="good" x="32" y="138" font-size="15" font-weight="600">correct</text>
<rect class="badBg" x="372" y="50" width="332" height="100" rx="8"/>
<text class="ink" x="388" y="82" font-size="16" font-weight="600">x *= x</text>
<text class="ink" x="388" y="112" font-size="16">(2, 0, 3, 6190)</text>
<text class="bad" x="388" y="138" font-size="15" font-weight="600">wrong, expected 3714</text>
<text class="muted" x="16" y="186" font-size="14">Sub-problem 2 score of a solution that multiplies a value by itself (out of 5)</text>
<text class="ink" x="16" y="218" font-size="15">original library</text>
<rect class="bad" x="180" y="198" width="20.0" height="26"/>
<text class="bad" x="208.0" y="218" font-size="15" font-weight="600">0.25</text>
<text class="ink" x="16" y="256" font-size="15">fixed library</text>
<rect class="good" x="180" y="236" width="400.0" height="26"/>
<text class="good" x="588.0" y="256" font-size="15" font-weight="600">5.00</text>
</svg>
