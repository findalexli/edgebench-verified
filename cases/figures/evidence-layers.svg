<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img">
<title>Four evidence layers with different scope: tasks examined in the original code and images, models proved in Lean 4 or checked in TLA+, historical paired comparisons of saved versions, and fixed tasks covered by one public agent run.</title>
<style>.ink{fill:#1b1f23} .muted{fill:#5f6368} .box{fill:#f6f7f9;stroke:#c9ced4} .hl{fill:#fff6c8;stroke:#d9c25a} .num{fill:#1a4f8b} text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}@media (prefers-color-scheme: dark){.ink{fill:#e2e9ed} .muted{fill:#95a6b1} .box{fill:#1b2630;stroke:#3a4a57} .hl{fill:#3a3418;stroke:#8a7a2a} .num{fill:#6cb6d3}}</style>
<rect class="box" x="0.5" y="0.5" width="177" height="208" rx="8"/>
<text class="num" x="16" y="36" font-size="26" font-weight="600">1</text>
<text class="ink" x="16" y="66" font-size="16.5" font-weight="600">Examined</text>
<text class="muted" x="16" y="87" font-size="14">original code and images</text>
<text class="ink" x="16" y="124" font-size="14">51 tasks examined</text>
<text class="ink" x="16" y="148" font-size="14">source, component and</text>
<text class="ink" x="16" y="172" font-size="14">native evidence</text>
<rect class="hl" x="194.5" y="0.5" width="177" height="208" rx="8"/>
<text class="num" x="210" y="36" font-size="26" font-weight="600">2</text>
<text class="ink" x="210" y="66" font-size="16.5" font-weight="600">Proved formally</text>
<text class="muted" x="210" y="87" font-size="14">Lean 4 and TLA+</text>
<text class="ink" x="210" y="124" font-size="14">26 tasks, 286 theorems</text>
<text class="ink" x="210" y="148" font-size="14">20 model-checking runs</text>
<text class="ink" x="210" y="172" font-size="14">10 repair models checked</text>
<rect class="box" x="388.5" y="0.5" width="177" height="208" rx="8"/>
<text class="num" x="404" y="36" font-size="26" font-weight="600">3</text>
<text class="ink" x="404" y="66" font-size="16.5" font-weight="600">Historical pairs</text>
<text class="muted" x="404" y="87" font-size="14">components and graders</text>
<text class="ink" x="404" y="124" font-size="14">30 fixes + 1 partial fix</text>
<text class="ink" x="404" y="148" font-size="14">206 comparisons</text>
<text class="ink" x="404" y="172" font-size="14">nearly all run 3 times</text>
<rect class="box" x="582.5" y="0.5" width="177" height="208" rx="8"/>
<text class="num" x="598" y="36" font-size="26" font-weight="600">4</text>
<text class="ink" x="598" y="66" font-size="16.5" font-weight="600">Checked on real runs</text>
<text class="muted" x="598" y="87" font-size="14">a public agent run</text>
<text class="ink" x="598" y="124" font-size="14">9 fixed tasks covered;</text>
<text class="ink" x="598" y="148" font-size="14">7 regraded with</text>
<text class="ink" x="598" y="172" font-size="14">both graders;</text>
<text class="ink" x="598" y="196" font-size="14">Lean computed</text>
</svg>
