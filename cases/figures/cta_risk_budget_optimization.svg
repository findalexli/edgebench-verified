<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Bars show an overseas share of 0.175 as the original grader reads it, passing the 0.40 limit, against 0.595 once US-dollar positions are converted to yuan, which breaches it.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>
<text class="ink" x="16" y="30" font-size="18" font-weight="600">Overseas share, 2021-06-01 (10 CU.SHF + 8 GC.CME lots)</text>
<rect class="warnBg" x="291.2" y="86" width="412.8" height="140"/>
<text class="warn" x="497.59999999999997" y="106" font-size="14" text-anchor="middle">over the 40% limit</text>
<rect class="acc" x="16" y="120" width="120.39999999999999" height="34"/><text class="acc" x="144.39999999999998" y="143" font-size="15" font-weight="600">0.175</text>
<text class="muted" x="304" y="143" font-size="14">grader, USD not converted: passes</text>
<rect class="bad" x="16" y="170" width="409.35999999999996" height="34"/><text x="417.35999999999996" y="193" font-size="15" font-weight="600" text-anchor="end" fill="#fff">0.595</text>
<text class="bad" x="433.35999999999996" y="193" font-size="14" font-weight="600">in yuan</text>
<line class="inkS" x1="291.2" y1="80" x2="291.2" y2="232" stroke-width="2" stroke-dasharray="5 4"/>
<text class="muted" x="16" y="254" font-size="14">0</text><text class="ink" x="291.2" y="254" font-size="14" text-anchor="middle">0.40</text><text class="muted" x="704" y="254" font-size="14" text-anchor="end">1</text>
<text class="muted" x="16" y="284" font-size="14">Fixed grader converts USD at USDCNY and flags the breach.</text>
</svg>
