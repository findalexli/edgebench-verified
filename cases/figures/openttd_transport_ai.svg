<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Flow: the original instructions tell the solver to call GetCompanyValue, which does not exist in OpenTTD 13.4, so the script dies and scores 0 on all 5 seeds; the fixed version names GetQuarterlyCompanyValue, which exists.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker></defs>
<text x="16" y="30" font-size="18" font-weight="700" class="ink">The instructions name a function that is missing</text>
<text x="16" y="62" font-size="14" font-weight="700" class="bad">Original</text>
<rect x="16" y="72" width="190" height="64" rx="8" class="accBg"/>
<text x="111" y="98" font-size="14" text-anchor="middle" class="muted">Instructions say</text>
<text x="111" y="122" font-size="15" text-anchor="middle" class="ink">GetCompanyValue</text>
<line x1="208" y1="104" x2="248" y2="104" class="inkS" stroke-width="2" marker-end="url(#a)"/>
<rect x="252" y="72" width="210" height="64" rx="8" class="badBg"/>
<text x="357" y="98" font-size="14" text-anchor="middle" class="muted">OpenTTD 13.4</text>
<text x="357" y="122" font-size="15" text-anchor="middle" class="bad">function does not exist</text>
<line x1="464" y1="104" x2="504" y2="104" class="inkS" stroke-width="2" marker-end="url(#a)"/>
<rect x="508" y="72" width="196" height="64" rx="8" class="badBg"/>
<text x="606" y="98" font-size="14" text-anchor="middle" class="muted">Script dies</text>
<text x="606" y="122" font-size="15" text-anchor="middle" class="bad">score 0 on 5/5 seeds</text>
<text x="16" y="186" font-size="14" font-weight="700" class="good">Fixed</text>
<rect x="16" y="196" width="250" height="64" rx="8" class="accBg"/>
<text x="141" y="222" font-size="14" text-anchor="middle" class="muted">Instructions and starter say</text>
<text x="141" y="246" font-size="14" text-anchor="middle" class="ink">GetQuarterlyCompanyValue</text>
<line x1="268" y1="228" x2="308" y2="228" class="inkS" stroke-width="2" marker-end="url(#a)"/>
<rect x="312" y="196" width="200" height="64" rx="8" class="goodBg"/>
<text x="412" y="222" font-size="14" text-anchor="middle" class="muted">OpenTTD 13.4</text>
<text x="412" y="246" font-size="15" text-anchor="middle" class="good">function exists</text>
<line x1="514" y1="228" x2="554" y2="228" class="inkS" stroke-width="2" marker-end="url(#a)"/>
<rect x="558" y="196" width="146" height="64" rx="8" class="goodBg"/>
<text x="631" y="234" font-size="15" text-anchor="middle" class="good">script runs</text>
</svg>
