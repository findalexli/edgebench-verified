<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Sketch of a dart-shaped quadrilateral where flipping the inner edge makes two triangles overlap; the original grader accepts the flip (Score = 41) and the fixed version rejects it as an invalid flip.</title>
<style>
  .ink{fill:#14212b} .muted{fill:#566773} .rule{stroke:#d3dbe0} .bg{fill:#ffffff}
  .good{fill:#2c7a57} .bad{fill:#ad3528} .warn{fill:#9a6510} .acc{fill:#0f5c78}
  .goodS{stroke:#2c7a57} .badS{stroke:#ad3528} .accS{stroke:#0f5c78} .inkS{stroke:#14212b}
  .goodBg{fill:#e4f2ea} .badBg{fill:#f6e2df} .warnBg{fill:#f6ecda} .accBg{fill:#e3eff4}
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e2e9ed} .muted{fill:#95a6b1} .rule{stroke:#2a3843} .bg{fill:#152029}
    .good{fill:#6cc79a} .bad{fill:#f08a7c} .warn{fill:#e0a64a} .acc{fill:#6cb6d3}
    .goodS{stroke:#6cc79a} .badS{stroke:#f08a7c} .accS{stroke:#6cb6d3} .inkS{stroke:#e2e9ed}
    .goodBg{fill:#15302a} .badBg{fill:#3a1f1c} .warnBg{fill:#352a16} .accBg{fill:#16303c}
  }
</style>

<text x="16" y="30" font-size="18" font-weight="700" class="ink">A forbidden flip is accepted</text>
<polygon points="60,250 180,170 300,250 180,70" class="warnBg"/>
<polygon points="60,250 180,170 300,250 180,70" fill="none" class="inkS" stroke-width="2"/>
<line x1="180" y1="170" x2="180" y2="70" class="inkS" stroke-width="2"/>
<polygon points="60,250 180,170 300,250" class="bad" fill-opacity="0.3"/>
<line x1="60" y1="250" x2="300" y2="250" class="badS" stroke-width="4" stroke-dasharray="9 6"/>
<text x="174" y="144" font-size="13" class="muted" text-anchor="end">old</text><text x="174" y="160" font-size="13" class="muted" text-anchor="end">edge</text>
<text x="180" y="234" font-size="13" text-anchor="middle" font-weight="600" class="bad">overlap</text>
<text x="16" y="60" font-size="13" class="muted">Sketch: four-sided shape with a dent (not convex)</text>
<text x="180" y="278" font-size="14" text-anchor="middle" class="bad">new edge: triangles overlap</text>
<rect x="352" y="56" width="352" height="64" rx="8" class="badBg"/>
<text x="368" y="82" font-size="15" font-weight="700" class="bad">Original grader: accepted</text>
<text x="368" y="106" font-size="15" class="ink">Flip scored as normal (score 41)</text>
<rect x="352" y="132" width="352" height="64" rx="8" class="goodBg"/>
<text x="368" y="158" font-size="15" font-weight="700" class="good">Fixed version: rejected</text>
<text x="368" y="182" font-size="15" class="ink">Error: invalid flip</text>
<text x="352" y="228" font-size="14" class="muted">Real hidden case 0009:</text>
<text x="352" y="252" font-size="15" class="ink">one forbidden flip improves (lowers) the score</text>
<text x="352" y="276" font-size="15" font-weight="700" class="ink">644,809 → 641,611</text>
</svg>
