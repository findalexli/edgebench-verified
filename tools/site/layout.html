<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<meta name="color-scheme" content="light">
{{alternates}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
{{lang_head}}
<link rel="stylesheet" href="{{site_root}}assets/site.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<a class="skip" href="#content">{{t:nav.skip}}</a>
<header class="bar"><div class="in">
  <a class="home" href="{{root}}index.html">{{t:site.name}}</a>
  <span class="lang" aria-label="{{t:nav.language}}">{{lang_switch}}</span>
  <nav class="tabs" aria-label="{{t:nav.label}}">{{tabs}}</nav>
</div></header>
{{pending}}
<main id="content"{{main_lang}}>
{{content}}
</main>
<footer class="{{footer_class}}">{{t:footer.text}}</footer>
{{scripts}}
</body>
</html>
