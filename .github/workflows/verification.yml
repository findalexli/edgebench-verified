name: Verification checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e .
      - name: sforge/ and tasks/ match EdgeBench's original files (sforge/UPSTREAM.lock)
        run: python3 tools/check_upstream.py
      - name: Published counts and decisions agree with data/decisions.json
        run: python tools/check_consistency.py
      - name: No image-file copies, tamper material or credentials in the tree
        run: python tools/check_publish.py
      - name: TLA+ models reproduce their published outcomes
        run: python tools/check_formal.py --tla-only
