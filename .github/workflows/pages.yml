name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages needs a public repository on this plan; the job is skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only data files are copied; the site links the Markdown documents on GitHub, where their relative links work.
      - name: Add downloadable data next to the page
        run: |
          mkdir -p site/data
          cp data/decisions.csv data/decisions.json data/paired-results.csv data/paired-repeatability.csv data/impact.csv site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
